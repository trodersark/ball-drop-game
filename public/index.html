<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ball Drop Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        #gameCanvas {
            border: 3px solid #667eea;
            border-radius: 10px;
            display: block;
            margin: 20px auto;
            background: linear-gradient(to bottom, #1a1a2e 0%, #2d2d44 100%);
            cursor: pointer;
            box-shadow: inset 0 5px 15px rgba(0,0,0,0.1);
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s;
        }
        button:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        button:disabled { 
            background: #ccc; 
            cursor: not-allowed;
            transform: none;
        }
        .info {
            text-align: center;
            margin: 15px 0;
            padding: 15px;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 10px;
        }
        .status {
            font-weight: bold;
            font-size: 20px;
            color: #667eea;
        }
        .difficulty {
            color: #dc3545;
            font-size: 14px;
            font-weight: bold;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍗 Ball Drop Game 🍗</h1>
        <canvas id="gameCanvas" width="500" height="650"></canvas>
        <div class="controls">
            <button id="startButton">Start Game</button>
        </div>
        <div class="info">
            <p class="status" id="status">Click Start Game!</p>
            <p class="difficulty">🍗 Dodge the drumsticks! Land in the volcano! 🌋</p>
            <p>Games: <span id="gamesPlayed">0</span></p>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startButton = document.getElementById('startButton');
        const statusText = document.getElementById('status');
        const gamesPlayedSpan = document.getElementById('gamesPlayed');
        
        let ball = null;
        let gameActive = false;
        let gamesPlayed = 0;
        let gameOver = false;
        let playerWon = false;
        let fireIntensity = 1;
        
        const BALL_RADIUS = 12;
        const BALL_SPEED = 6;
        const GRAVITY = 0.3;
        const FIRE_Y = canvas.height - 100;
        const VOLCANO_X = canvas.width / 2;
        const VOLCANO_WIDTH = 80;
        const VOLCANO_Y = FIRE_Y - 30;

        const PEG_RADIUS = 12;
        const PEG_ROWS = 7;
        const PEG_COLS = 9;
        const pegs = [];
        
        let fireParticles = [];
        let smokeParticles = [];
        let waterParticles = [];
        let steamParticles = [];
        
        function createPegs() {
            const startY = 100;
            const spacingY = 48;
            const spacingX = 55;
            
            for (let row = 0; row < PEG_ROWS; row++) {
                const cols = row % 2 === 0 ? PEG_COLS : PEG_COLS - 1;
                const offsetX = row % 2 === 0 ? 25 : 52;
                
                for (let col = 0; col < cols; col++) {
                    const x = offsetX + col * spacingX;
                    const y = startY + row * spacingY;
                    const rotation = (Math.random() - 0.5) * 0.6;
                    pegs.push({ x, y, radius: PEG_RADIUS, rotation, lastHit: 0 });
                }
            }
        }
        createPegs();
        
        function createFireParticle() {
            return {
                x: Math.random() * canvas.width,
                y: FIRE_Y + 20 + Math.random() * 30,
                size: 20 + Math.random() * 40,
                speedY: -1 - Math.random() * 3,
                speedX: (Math.random() - 0.5) * 2,
                life: 1,
                decay: 0.01 + Math.random() * 0.02
            };
        }
        
        function createSmokeParticle() {
            return {
                x: Math.random() * canvas.width,
                y: FIRE_Y - Math.random() * 30,
                size: 15 + Math.random() * 25,
                speedY: -0.5 - Math.random() * 1,
                speedX: (Math.random() - 0.5) * 1,
                life: 0.5,
                decay: 0.005 + Math.random() * 0.01
            };
        }
        
        function createWaterParticle(x, y) {
            const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.5;
            const speed = 5 + Math.random() * 8;
            return {
                x: x,
                y: y,
                size: 4 + Math.random() * 6,
                speedX: Math.cos(angle) * speed,
                speedY: Math.sin(angle) * speed,
                life: 1,
                decay: 0.015
            };
        }
        
        function createSteamParticle(x, y) {
            return {
                x: x + (Math.random() - 0.5) * 100,
                y: y,
                size: 20 + Math.random() * 30,
                speedY: -2 - Math.random() * 2,
                speedX: (Math.random() - 0.5) * 2,
                life: 1,
                decay: 0.02
            };
        }
        
        function initParticles() {
            fireParticles = [];
            smokeParticles = [];
            waterParticles = [];
            steamParticles = [];
            
            for (let i = 0; i < 100; i++) {
                fireParticles.push(createFireParticle());
            }
            for (let i = 0; i < 30; i++) {
                smokeParticles.push(createSmokeParticle());
            }
        }
        initParticles();
        
        let frameCount = 0;
        
        class Ball {
            constructor() {
                this.x = canvas.width / 2;
                this.y = 50;
                this.vx = BALL_SPEED;
                this.vy = 0;
                this.radius = BALL_RADIUS;
                this.dropped = false;
                this.rotation = 0;
                this.sprayingWater = false;
            }
            
            update() {
                if (!this.dropped) {
                    this.x += this.vx;
                    if (this.x - this.radius < 0 || this.x + this.radius > canvas.width) {
                        this.vx *= -1;
                    }
                } else if (!this.sprayingWater) {
                    this.vy += GRAVITY;
                    this.x += this.vx;
                    this.y += this.vy;
                    this.rotation += this.vx * 0.05;
                    
                    if (this.vy > 10) this.vy = 10;
                    
                    for (let peg of pegs) {
                        const dx = this.x - peg.x;
                        const dy = this.y - peg.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        
                        if (distance < this.radius + peg.radius && frameCount - peg.lastHit > 10) {
                            peg.lastHit = frameCount;
                            
                            const angle = Math.atan2(dy, dx);
                            
                            this.x = peg.x + Math.cos(angle) * (this.radius + peg.radius + 3);
                            this.y = peg.y + Math.sin(angle) * (this.radius + peg.radius + 3);
                            
                            this.vx = (Math.random() - 0.5) * 6;
                            this.vy = 2 + Math.random() * 2;
                        }
                    }
                    
                    if (this.x - this.radius < 0) {
                        this.x = this.radius;
                        this.vx = Math.abs(this.vx) * 0.8;
                    }
                    if (this.x + this.radius > canvas.width) {
                        this.x = canvas.width - this.radius;
                        this.vx = -Math.abs(this.vx) * 0.8;
                    }
                    
                    if (this.y + this.radius >= VOLCANO_Y) {
                        this.checkWin();
                        return true;
                    }
                }
                return false;
            }
            
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                
                ctx.beginPath();
                ctx.arc(4, 4, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.fill();
                
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                
                let gradient;
                if (this.sprayingWater) {
                    gradient = ctx.createRadialGradient(-4, -4, 0, 0, 0, this.radius);
                    gradient.addColorStop(0, '#60a5fa');
                    gradient.addColorStop(0.3, '#3b82f6');
                    gradient.addColorStop(0.7, '#2563eb');
                    gradient.addColorStop(1, '#1d4ed8');
                } else {
                    gradient = ctx.createRadialGradient(-4, -4, 0, 0, 0, this.radius);
                    gradient.addColorStop(0, '#ff6b6b');
                    gradient.addColorStop(0.3, '#ee5a52');
                    gradient.addColorStop(0.7, '#dc3545');
                    gradient.addColorStop(1, '#991b1b');
                }
                
                ctx.fillStyle = gradient;
                ctx.fill();
                
                ctx.beginPath();
                ctx.arc(-4, -4, this.radius * 0.4, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.fill();
                
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.strokeStyle = this.sprayingWater ? '#1d4ed8' : '#991b1b';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                ctx.restore();
            }
            
            drop() {
                this.dropped = true;
            }
            
            checkWin() {
                const distance = Math.abs(this.x - VOLCANO_X);
                if (distance < VOLCANO_WIDTH / 2) {
                    statusText.textContent = '💧 SPLASH! Fire extinguished! 💧';
                    statusText.style.color = '#3b82f6';
                    playerWon = true;
                    this.sprayingWater = true;
                    this.y = VOLCANO_Y - 10;
                } else {
                    statusText.textContent = '🔥 Burned! Try again! 🔥';
                    statusText.style.color = '#dc3545';
                    playerWon = false;
                }
                gameActive = false;
                gameOver = true;
                startButton.disabled = false;
            }
        }
        
        function drawChickenDrumstick(x, y, radius, rotation) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rotation);
            
            const meatRadius = radius * 1.1;
            const boneLength = radius * 2;
            const boneWidth = radius * 0.4;
            
            // Shadow
            ctx.beginPath();
            ctx.arc(3, 3, meatRadius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fill();
            
            // Bone shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.beginPath();
            ctx.moveTo(-boneWidth / 2 + 3, meatRadius * 0.5 + 3);
            ctx.lineTo(-boneWidth / 2 + 3, meatRadius * 0.5 + boneLength + 3);
            ctx.lineTo(boneWidth / 2 + 3, meatRadius * 0.5 + boneLength + 3);
            ctx.lineTo(boneWidth / 2 + 3, meatRadius * 0.5 + 3);
            ctx.fill();
            
            // Bone
            ctx.fillStyle = '#f8f4e8';
            ctx.beginPath();
            ctx.moveTo(-boneWidth / 2, meatRadius * 0.5);
            ctx.lineTo(-boneWidth / 2, meatRadius * 0.5 + boneLength);
            ctx.lineTo(boneWidth / 2, meatRadius * 0.5 + boneLength);
            ctx.lineTo(boneWidth / 2, meatRadius * 0.5);
            ctx.fill();
            
            // Bone end knob
            ctx.beginPath();
            ctx.arc(0, meatRadius * 0.5 + boneLength, boneWidth * 0.7, 0, Math.PI * 2);
            ctx.fillStyle = '#f8f4e8';
            ctx.fill();
            ctx.strokeStyle = '#d9d0c0';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            
            // Bone highlight
            ctx.fillStyle = '#fffdf8';
            ctx.fillRect(-boneWidth / 2 + 2, meatRadius * 0.5 + 2, boneWidth * 0.3, boneLength - 4);
            
            // Bone outline
            ctx.strokeStyle = '#d9d0c0';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(-boneWidth / 2, meatRadius * 0.5);
            ctx.lineTo(-boneWidth / 2, meatRadius * 0.5 + boneLength);
            ctx.moveTo(boneWidth / 2, meatRadius * 0.5);
            ctx.lineTo(boneWidth / 2, meatRadius * 0.5 + boneLength);
            ctx.stroke();
            
            // Main meat - golden fried chicken
            ctx.beginPath();
            ctx.arc(0, 0, meatRadius, 0, Math.PI * 2);
            
            const meatGradient = ctx.createRadialGradient(-meatRadius * 0.3, -meatRadius * 0.3, 0, 0, 0, meatRadius);
            meatGradient.addColorStop(0, '#f5b041');
            meatGradient.addColorStop(0.4, '#e59525');
            meatGradient.addColorStop(0.7, '#d4781c');
            meatGradient.addColorStop(1, '#a85d14');
            
            ctx.fillStyle = meatGradient;
            ctx.fill();
            
            // Crispy bumps
            const bumps = [
                {x: -meatRadius * 0.4, y: -meatRadius * 0.3, r: 3},
                {x: meatRadius * 0.3, y: -meatRadius * 0.4, r: 2.5},
                {x: meatRadius * 0.5, y: meatRadius * 0.1, r: 3},
                {x: -meatRadius * 0.5, y: meatRadius * 0.2, r: 2.5},
                {x: 0, y: -meatRadius * 0.6, r: 2},
                {x: meatRadius * 0.2, y: meatRadius * 0.5, r: 2.5},
            ];
            
            ctx.fillStyle = '#c9691a';
            for (let bump of bumps) {
                ctx.beginPath();
                ctx.arc(bump.x, bump.y, bump.r, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // Dark crispy spots
            const darkSpots = [
                {x: -meatRadius * 0.2, y: meatRadius * 0.3, r: 2},
                {x: meatRadius * 0.4, y: -meatRadius * 0.2, r: 1.5},
                {x: -meatRadius * 0.5, y: -meatRadius * 0.1, r: 1.5},
            ];
            
            ctx.fillStyle = '#8b4513';
            for (let spot of darkSpots) {
                ctx.beginPath();
                ctx.arc(spot.x, spot.y, spot.r, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // Highlight shine
            ctx.beginPath();
            ctx.ellipse(-meatRadius * 0.3, -meatRadius * 0.35, meatRadius * 0.35, meatRadius * 0.25, -0.5, 0, Math.PI * 2);
            const shineGradient = ctx.createRadialGradient(-meatRadius * 0.3, -meatRadius * 0.35, 0, -meatRadius * 0.3, -meatRadius * 0.35, meatRadius * 0.35);
            shineGradient.addColorStop(0, 'rgba(255, 240, 180, 0.8)');
            shineGradient.addColorStop(0.5, 'rgba(255, 220, 150, 0.4)');
            shineGradient.addColorStop(1, 'rgba(255, 200, 100, 0)');
            ctx.fillStyle = shineGradient;
            ctx.fill();
            
            // Small secondary highlight
            ctx.beginPath();
            ctx.arc(meatRadius * 0.25, -meatRadius * 0.5, meatRadius * 0.12, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 220, 0.6)';
            ctx.fill();
            
            // Outline
            ctx.beginPath();
            ctx.arc(0, 0, meatRadius, 0, Math.PI * 2);
            ctx.strokeStyle = '#8b4513';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.restore();
        }
        
        function drawPegs() {
            for (let peg of pegs) {
                drawChickenDrumstick(peg.x, peg.y, peg.radius, peg.rotation);
            }
        }
        
        function drawVolcano() {
            const vx = VOLCANO_X;
            const vy = VOLCANO_Y;
            const width = VOLCANO_WIDTH;
            const mountainHeight = 120;
            
            // Back mountain layer (darker, for depth)
            ctx.beginPath();
            ctx.moveTo(vx - width - 80, canvas.height);
            ctx.lineTo(vx - width - 40, vy + 20);
            ctx.quadraticCurveTo(vx - width, vy - 10, vx - width / 2 - 10, vy);
            ctx.lineTo(vx + width / 2 + 10, vy);
            ctx.quadraticCurveTo(vx + width, vy - 10, vx + width + 40, vy + 20);
            ctx.lineTo(vx + width + 80, canvas.height);
            ctx.closePath();
            
            const backGradient = ctx.createLinearGradient(vx, vy, vx, canvas.height);
            backGradient.addColorStop(0, '#3d2914');
            backGradient.addColorStop(0.5, '#4a3520');
            backGradient.addColorStop(1, '#2d1f10');
            ctx.fillStyle = backGradient;
            ctx.fill();
            
            // Main mountain body
            ctx.beginPath();
            ctx.moveTo(vx - width - 50, canvas.height);
            ctx.lineTo(vx - width / 2, vy + 5);
            ctx.lineTo(vx + width / 2, vy + 5);
            ctx.lineTo(vx + width + 50, canvas.height);
            ctx.closePath();
            
            const mountainGradient = ctx.createLinearGradient(vx - width, vy, vx + width, vy);
            mountainGradient.addColorStop(0, '#5c4033');
            mountainGradient.addColorStop(0.3, '#6b4c38');
            mountainGradient.addColorStop(0.5, '#7a5a45');
            mountainGradient.addColorStop(0.7, '#6b4c38');
            mountainGradient.addColorStop(1, '#5c4033');
            ctx.fillStyle = mountainGradient;
            ctx.fill();
            
            // Left side shading
            ctx.beginPath();
            ctx.moveTo(vx - width - 50, canvas.height);
            ctx.lineTo(vx - width / 2, vy + 5);
            ctx.lineTo(vx - width / 4, canvas.height);
            ctx.closePath();
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fill();
            
            // Right side highlight
            ctx.beginPath();
            ctx.moveTo(vx + width + 50, canvas.height);
            ctx.lineTo(vx + width / 2, vy + 5);
            ctx.lineTo(vx + width / 4, canvas.height);
            ctx.closePath();
            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.fill();
            
            // Rock textures on mountain
            ctx.fillStyle = '#4a3828';
            const rocks = [
                {x: vx - 60, y: vy + 60, w: 25, h: 15},
                {x: vx + 40, y: vy + 80, w: 20, h: 12},
                {x: vx - 30, y: vy + 100, w: 18, h: 10},
                {x: vx + 70, y: vy + 50, w: 15, h: 10},
                {x: vx - 80, y: vy + 90, w: 22, h: 14},
            ];
            
            for (let rock of rocks) {
                ctx.beginPath();
                ctx.ellipse(rock.x, rock.y, rock.w / 2, rock.h / 2, 0.2, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // Volcano rim
            ctx.beginPath();
            ctx.ellipse(vx, vy + 5, width / 2 + 15, 18, 0, 0, Math.PI * 2);
            
            const rimGradient = ctx.createLinearGradient(vx - width / 2, vy, vx + width / 2, vy);
            rimGradient.addColorStop(0, '#4a3525');
            rimGradient.addColorStop(0.3, '#6b4c38');
            rimGradient.addColorStop(0.5, '#8b6347');
            rimGradient.addColorStop(0.7, '#6b4c38');
            rimGradient.addColorStop(1, '#4a3525');
            ctx.fillStyle = rimGradient;
            ctx.fill();
            
            // Rim highlight
            ctx.beginPath();
            ctx.ellipse(vx, vy + 2, width / 2 + 12, 12, 0, Math.PI, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // Crater (hole)
            ctx.beginPath();
            ctx.ellipse(vx, vy + 8, width / 2, 14, 0, 0, Math.PI * 2);
            
            const craterGradient = ctx.createRadialGradient(vx, vy + 8, 0, vx, vy + 8, width / 2);
            craterGradient.addColorStop(0, '#0a0500');
            craterGradient.addColorStop(0.6, '#1a0f05');
            craterGradient.addColorStop(1, '#2d1a0a');
            ctx.fillStyle = craterGradient;
            ctx.fill();
            
            // Lava glow inside crater
            if (fireIntensity > 0.1) {
                ctx.beginPath();
                ctx.ellipse(vx, vy + 12, width / 2 - 8, 10, 0, 0, Math.PI * 2);
                
                const lavaGradient = ctx.createRadialGradient(vx, vy + 12, 0, vx, vy + 12, width / 2 - 8);
                lavaGradient.addColorStop(0, `rgba(255, 220, 50, ${fireIntensity * 0.9})`);
                lavaGradient.addColorStop(0.4, `rgba(255, 150, 0, ${fireIntensity * 0.7})`);
                lavaGradient.addColorStop(0.7, `rgba(255, 80, 0, ${fireIntensity * 0.5})`);
                lavaGradient.addColorStop(1, `rgba(200, 50, 0, ${fireIntensity * 0.2})`);
                ctx.fillStyle = lavaGradient;
                ctx.fill();
            }
            
            // Snow cap on top edges
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.beginPath();
            ctx.moveTo(vx - width / 2 - 5, vy + 8);
            ctx.quadraticCurveTo(vx - width / 2 - 15, vy + 2, vx - width / 2 - 10, vy + 20);
            ctx.quadraticCurveTo(vx - width / 2 - 5, vy + 15, vx - width / 2, vy + 10);
            ctx.closePath();
            ctx.fill();
            
            ctx.beginPath();
            ctx.moveTo(vx + width / 2 + 5, vy + 8);
            ctx.quadraticCurveTo(vx + width / 2 + 15, vy + 2, vx + width / 2 + 10, vy + 20);
            ctx.quadraticCurveTo(vx + width / 2 + 5, vy + 15, vx + width / 2, vy + 10);
            ctx.closePath();
            ctx.fill();
        }
        
        function updateAndDrawFire() {
            if (fireIntensity <= 0) return;
            
            for (let i = 0; i < fireParticles.length; i++) {
                const p = fireParticles[i];
                
                p.x += p.speedX;
                p.y += p.speedY;
                p.life -= p.decay;
                p.size *= 0.99;
                
                if (p.life <= 0 || p.size < 2) {
                    fireParticles[i] = createFireParticle();
                    continue;
                }
                
                const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * fireIntensity);
                
                if (p.life > 0.7) {
                    gradient.addColorStop(0, `rgba(255, 255, 255, ${p.life * fireIntensity})`);
                    gradient.addColorStop(0.2, `rgba(255, 255, 100, ${p.life * 0.9 * fireIntensity})`);
                    gradient.addColorStop(0.5, `rgba(255, 150, 0, ${p.life * 0.7 * fireIntensity})`);
                    gradient.addColorStop(1, `rgba(255, 50, 0, 0)`);
                } else if (p.life > 0.4) {
                    gradient.addColorStop(0, `rgba(255, 200, 50, ${p.life * fireIntensity})`);
                    gradient.addColorStop(0.3, `rgba(255, 100, 0, ${p.life * 0.8 * fireIntensity})`);
                    gradient.addColorStop(0.7, `rgba(200, 50, 0, ${p.life * 0.5 * fireIntensity})`);
                    gradient.addColorStop(1, `rgba(100, 0, 0, 0)`);
                } else {
                    gradient.addColorStop(0, `rgba(255, 100, 0, ${p.life * fireIntensity})`);
                    gradient.addColorStop(0.5, `rgba(150, 30, 0, ${p.life * 0.6 * fireIntensity})`);
                    gradient.addColorStop(1, `rgba(50, 0, 0, 0)`);
                }
                
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * fireIntensity, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();
            }
            
            for (let i = 0; i < smokeParticles.length; i++) {
                const p = smokeParticles[i];
                
                p.x += p.speedX;
                p.y += p.speedY;
                p.life -= p.decay;
                p.size *= 1.01;
                
                if (p.life <= 0) {
                    smokeParticles[i] = createSmokeParticle();
                    continue;
                }
                
                const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
                gradient.addColorStop(0, `rgba(80, 80, 80, ${p.life * 0.3 * fireIntensity})`);
                gradient.addColorStop(0.5, `rgba(60, 60, 60, ${p.life * 0.2 * fireIntensity})`);
                gradient.addColorStop(1, `rgba(40, 40, 40, 0)`);
                
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();
            }
            
            for (let i = 0; i < 20; i++) {
                const x = (canvas.width / 20) * i + Math.sin(frameCount * 0.1 + i) * 10;
                const flameHeight = (40 + Math.sin(frameCount * 0.15 + i * 0.5) * 20) * fireIntensity;
                const flameWidth = 25 + Math.sin(frameCount * 0.1 + i) * 5;
                
                if (flameHeight < 5) continue;
                
                const gradient = ctx.createLinearGradient(x, canvas.height, x, canvas.height - flameHeight);
                gradient.addColorStop(0, `rgba(255, 100, 0, ${0.9 * fireIntensity})`);
                gradient.addColorStop(0.3, `rgba(255, 200, 0, ${0.8 * fireIntensity})`);
                gradient.addColorStop(0.6, `rgba(255, 100, 0, ${0.6 * fireIntensity})`);
                gradient.addColorStop(1, 'rgba(255, 50, 0, 0)');
                
                ctx.beginPath();
                ctx.moveTo(x - flameWidth / 2, canvas.height);
                ctx.quadraticCurveTo(x - flameWidth / 4, canvas.height - flameHeight * 0.7, x, canvas.height - flameHeight);
                ctx.quadraticCurveTo(x + flameWidth / 4, canvas.height - flameHeight * 0.7, x + flameWidth / 2, canvas.height);
                ctx.closePath();
                ctx.fillStyle = gradient;
                ctx.fill();
            }
            
            const glowGradient = ctx.createLinearGradient(0, FIRE_Y, 0, canvas.height);
            glowGradient.addColorStop(0, 'rgba(255, 100, 0, 0)');
            glowGradient.addColorStop(0.5, `rgba(255, 100, 0, ${0.3 * fireIntensity})`);
            glowGradient.addColorStop(1, `rgba(255, 50, 0, ${0.5 * fireIntensity})`);
            
            ctx.fillStyle = glowGradient;
            ctx.fillRect(0, FIRE_Y, canvas.width, canvas.height - FIRE_Y);
        }
        
        function updateAndDrawWater() {
            if (!playerWon || !ball) return;
            
            if (fireIntensity > 0) {
                for (let i = 0; i < 5; i++) {
                    waterParticles.push(createWaterParticle(ball.x, ball.y));
                }
                fireIntensity -= 0.008;
                if (fireIntensity < 0) fireIntensity = 0;
            }
            
            if (fireIntensity > 0.1 && Math.random() < 0.3) {
                steamParticles.push(createSteamParticle(ball.x, FIRE_Y));
            }
            
            for (let i = waterParticles.length - 1; i >= 0; i--) {
                const p = waterParticles[i];
                
                p.speedY += 0.2;
                p.x += p.speedX;
                p.y += p.speedY;
                p.life -= p.decay;
                
                if (p.life <= 0 || p.y > canvas.height) {
                    waterParticles.splice(i, 1);
                    continue;
                }
                
                const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
                gradient.addColorStop(0, `rgba(150, 200, 255, ${p.life})`);
                gradient.addColorStop(0.5, `rgba(100, 150, 255, ${p.life * 0.8})`);
                gradient.addColorStop(1, `rgba(50, 100, 200, 0)`);
                
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();
            }
            
            for (let i = steamParticles.length - 1; i >= 0; i--) {
                const p = steamParticles[i];
                
                p.x += p.speedX;
                p.y += p.speedY;
                p.life -= p.decay;
                p.size *= 1.02;
                
                if (p.life <= 0) {
                    steamParticles.splice(i, 1);
                    continue;
                }
                
                const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
                gradient.addColorStop(0, `rgba(200, 200, 200, ${p.life * 0.4})`);
                gradient.addColorStop(0.5, `rgba(180, 180, 180, ${p.life * 0.2})`);
                gradient.addColorStop(1, 'rgba(150, 150, 150, 0)');
                
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();
            }
        }
        
        function gameLoop() {
            frameCount++;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            updateAndDrawFire();
            drawVolcano();
            updateAndDrawWater();
            drawPegs();
            
            if (ball) {
                if (gameActive) {
                    ball.update();
                }
                ball.draw();
            }
            
            requestAnimationFrame(gameLoop);
        }
        
        startButton.addEventListener('click', function() {
            startButton.disabled = true;
            gamesPlayed++;
            gamesPlayedSpan.textContent = gamesPlayed;
            gameOver = false;
            playerWon = false;
            fireIntensity = 1;
            waterParticles = [];
            steamParticles = [];
            initParticles();
            ball = new Ball();
            gameActive = true;
            statusText.textContent = 'Click to drop the ball!';
            statusText.style.color = '#667eea';
        });
        
        canvas.addEventListener('click', function() {
            if (gameActive && ball && !ball.dropped) {
                ball.drop();
                statusText.textContent = '🌋 Falling...';
            }
        });
        
        gameLoop();
    </script>
</body>
</html>
