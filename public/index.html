<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ball Drop Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        #gameCanvas {
            border: 3px solid #667eea;
            border-radius: 10px;
            display: block;
            margin: 20px auto;
            cursor: pointer;
            box-shadow: inset 0 5px 15px rgba(0,0,0,0.1);
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s;
        }
        button:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        button:disabled { 
            background: #ccc; 
            cursor: not-allowed;
            transform: none;
        }
        .info {
            text-align: center;
            margin: 15px 0;
            padding: 15px;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 10px;
        }
        .status {
            font-weight: bold;
            font-size: 20px;
            color: #667eea;
        }
        .difficulty {
            color: #dc3545;
            font-size: 14px;
            font-weight: bold;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍗 Ball Drop Game 🍗</h1>
        <canvas id="gameCanvas" width="500" height="700"></canvas>
        <div class="controls">
            <button id="startButton">Start Game</button>
        </div>
        <div class="info">
            <p class="status" id="status">Click Start Game!</p>
            <p class="difficulty">🍗 Dodge the drumettes! Don't fall in the volcano! 🌋</p>
            <p>Games: <span id="gamesPlayed">0</span></p>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startButton = document.getElementById('startButton');
        const statusText = document.getElementById('status');
        const gamesPlayedSpan = document.getElementById('gamesPlayed');
        
        let ball = null;
        let gameActive = false;
        let gamesPlayed = 0;
        let gameOver = false;
        let explosion = false;
        let explosionIntensity = 0;
        let screenShake = 0;
        
        const BALL_RADIUS = 12;
        const BALL_SPEED = 6;
        const GRAVITY = 0.3;
        const VOLCANO_X = canvas.width / 2;
        const VOLCANO_HOLE_WIDTH = 50;
        const VOLCANO_TOP_Y = canvas.height - 200;

        const PEG_RADIUS = 12;
        const PEG_ROWS = 6;
        const PEG_COLS = 9;
        let pegs = [];
        
        let fireParticles = [];
        let lavaDroplets = [];
        let smokeParticles = [];
        
        function createPegs() {
            pegs = [];
            const startY = 80;
            const spacingY = 50;
            const spacingX = 55;
            
            for (let row = 0; row < PEG_ROWS; row++) {
                const cols = row % 2 === 0 ? PEG_COLS : PEG_COLS - 1;
                const offsetX = row % 2 === 0 ? 25 : 52;
                
                for (let col = 0; col < cols; col++) {
                    const x = offsetX + col * spacingX;
                    const y = startY + row * spacingY;
                    const rotation = (Math.random() - 0.5) * 0.6;
                    pegs.push({ 
                        x, y, 
                        radius: PEG_RADIUS, 
                        rotation, 
                        lastHit: 0,
                        burning: false,
                        burnTimer: 0,
                        falling: false,
                        fallSpeed: 0,
                        fallRotation: 0
                    });
                }
            }
        }
        createPegs();
        
        function createLavaDroplet() {
            return {
                x: VOLCANO_X + (Math.random() - 0.5) * 40,
                y: VOLCANO_TOP_Y - 20,
                size: 3 + Math.random() * 5,
                speedX: (Math.random() - 0.5) * 8,
                speedY: -8 - Math.random() * 6,
                life: 1
            };
        }
        
        function createSmokeParticle() {
            return {
                x: VOLCANO_X + (Math.random() - 0.5) * 30,
                y: VOLCANO_TOP_Y - 60,
                size: 20 + Math.random() * 25,
                speedX: (Math.random() - 0.5) * 1.5,
                speedY: -1 - Math.random() * 1.5,
                life: 1,
                decay: 0.005 + Math.random() * 0.005
            };
        }
        
        function initSmokeParticles() {
            smokeParticles = [];
            for (let i = 0; i < 15; i++) {
                smokeParticles.push(createSmokeParticle());
            }
        }
        initSmokeParticles();
        
        function createExplosionParticle(x, y) {
            return {
                x: x || VOLCANO_X + (Math.random() - 0.5) * 60,
                y: y || VOLCANO_TOP_Y,
                size: 30 + Math.random() * 50,
                speedX: (Math.random() - 0.5) * 15,
                speedY: -5 - Math.random() * 15,
                life: 1,
                decay: 0.008 + Math.random() * 0.01
            };
        }
        
        let frameCount = 0;
        
        class Ball {
            constructor() {
                this.x = canvas.width / 2;
                this.y = 40;
                this.vx = BALL_SPEED;
                this.vy = 0;
                this.radius = BALL_RADIUS;
                this.dropped = false;
                this.rotation = 0;
                this.visible = true;
            }
            
            update() {
                if (!this.dropped) {
                    this.x += this.vx;
                    if (this.x - this.radius < 0 || this.x + this.radius > canvas.width) {
                        this.vx *= -1;
                    }
                } else if (this.visible) {
                    this.vy += GRAVITY;
                    this.x += this.vx;
                    this.y += this.vy;
                    this.rotation += this.vx * 0.05;
                    
                    if (this.vy > 10) this.vy = 10;
                    
                    for (let peg of pegs) {
                        if (peg.falling) continue;
                        const dx = this.x - peg.x;
                        const dy = this.y - peg.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        
                        if (distance < this.radius + peg.radius && frameCount - peg.lastHit > 10) {
                            peg.lastHit = frameCount;
                            const angle = Math.atan2(dy, dx);
                            this.x = peg.x + Math.cos(angle) * (this.radius + peg.radius + 3);
                            this.y = peg.y + Math.sin(angle) * (this.radius + peg.radius + 3);
                            this.vx = (Math.random() - 0.5) * 6;
                            this.vy = 2 + Math.random() * 2;
                        }
                    }
                    
                    if (this.x - this.radius < 0) {
                        this.x = this.radius;
                        this.vx = Math.abs(this.vx) * 0.8;
                    }
                    if (this.x + this.radius > canvas.width) {
                        this.x = canvas.width - this.radius;
                        this.vx = -Math.abs(this.vx) * 0.8;
                    }
                    
                    if (this.y + this.radius >= VOLCANO_TOP_Y + 10) {
                        this.checkWin();
                        return true;
                    }
                }
                return false;
            }
            
            draw() {
                if (!this.visible) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                
                ctx.beginPath();
                ctx.arc(4, 4, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.fill();
                
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                const gradient = ctx.createRadialGradient(-4, -4, 0, 0, 0, this.radius);
                gradient.addColorStop(0, '#ff6b6b');
                gradient.addColorStop(0.3, '#ee5a52');
                gradient.addColorStop(0.7, '#dc3545');
                gradient.addColorStop(1, '#991b1b');
                ctx.fillStyle = gradient;
                ctx.fill();
                
                ctx.beginPath();
                ctx.arc(-4, -4, this.radius * 0.4, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.fill();
                
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.strokeStyle = '#991b1b';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.restore();
            }
            
            drop() {
                this.dropped = true;
            }
            
            checkWin() {
                const distance = Math.abs(this.x - VOLCANO_X);
                if (distance < VOLCANO_HOLE_WIDTH / 2 + 10) {
                    statusText.textContent = '🔥 ERUPTION! Everything burns! 🔥';
                    statusText.style.color = '#ff4500';
                    this.visible = false;
                    explosion = true;
                    explosionIntensity = 0;
                    screenShake = 20;
                    for (let i = 0; i < 50; i++) {
                        fireParticles.push(createExplosionParticle());
                    }
                } else {
                    statusText.textContent = '✅ Safe landing! You survived!';
                    statusText.style.color = '#10b981';
                }
                gameActive = false;
                gameOver = true;
                startButton.disabled = false;
            }
        }
        
        function drawChickenDrumette(x, y, radius, rotation, burning, burnProgress) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rotation);
            
            const meatLength = radius * 2.2;
            const meatWidth = radius * 1.4;
            const boneLength = radius * 1.0;
            const boneWidth = radius * 0.35;
            
            let meatColor1 = '#f4a940';
            let meatColor2 = '#e8923a';
            let meatColor3 = '#d4782f';
            let meatColor4 = '#c45e20';
            let meatColor5 = '#8b4513';
            
            if (burning) {
                const burn = Math.min(burnProgress, 1);
                meatColor1 = `rgb(${Math.floor(244 - burn * 200)}, ${Math.floor(169 - burn * 169)}, ${Math.floor(64 - burn * 64)})`;
                meatColor2 = `rgb(${Math.floor(232 - burn * 200)}, ${Math.floor(146 - burn * 146)}, ${Math.floor(58 - burn * 58)})`;
                meatColor3 = `rgb(${Math.floor(212 - burn * 180)}, ${Math.floor(120 - burn * 120)}, ${Math.floor(47 - burn * 47)})`;
                meatColor4 = `rgb(${Math.floor(196 - burn * 170)}, ${Math.floor(94 - burn * 94)}, ${Math.floor(32 - burn * 32)})`;
                meatColor5 = `rgb(${Math.floor(139 - burn * 120)}, ${Math.floor(69 - burn * 69)}, ${Math.floor(19 - burn * 19)})`;
            }
            
            ctx.save();
            ctx.translate(3, 3);
            ctx.beginPath();
            ctx.ellipse(0, 0, meatWidth / 2, meatLength / 2, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fill();
            ctx.restore();
            
            ctx.fillStyle = burning ? `rgb(${200 - burnProgress * 150}, ${190 - burnProgress * 150}, ${180 - burnProgress * 150})` : '#f5f0e6';
            ctx.beginPath();
            ctx.roundRect(-boneWidth / 2, meatLength / 2 - 8, boneWidth, boneLength, 3);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(0, meatLength / 2 + boneLength - 10, boneWidth * 0.6, boneWidth * 0.45, 0, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.beginPath();
            ctx.ellipse(0, 0, meatWidth / 2, meatLength / 2, 0, 0, Math.PI * 2);
            const meatGradient = ctx.createRadialGradient(-meatWidth * 0.2, -meatLength * 0.2, 0, 0, 0, meatLength / 2);
            meatGradient.addColorStop(0, meatColor1);
            meatGradient.addColorStop(0.3, meatColor2);
            meatGradient.addColorStop(0.6, meatColor3);
            meatGradient.addColorStop(0.85, meatColor4);
            meatGradient.addColorStop(1, meatColor5);
            ctx.fillStyle = meatGradient;
            ctx.fill();
            
            const bumps = [
                {x: -meatWidth * 0.25, y: -meatLength * 0.2, r: 4},
                {x: meatWidth * 0.15, y: -meatLength * 0.25, r: 3.5},
                {x: meatWidth * 0.3, y: 0, r: 3},
                {x: -meatWidth * 0.3, y: meatLength * 0.1, r: 4},
                {x: 0, y: meatLength * 0.25, r: 3.5},
            ];
            ctx.fillStyle = burning ? `rgb(${Math.max(50, 205 - burnProgress * 180)}, ${Math.max(20, 106 - burnProgress * 100)}, ${Math.max(10, 39 - burnProgress * 30)})` : '#cd6a27';
            for (let bump of bumps) {
                ctx.beginPath();
                ctx.arc(bump.x, bump.y, bump.r, 0, Math.PI * 2);
                ctx.fill();
            }
            
            if (!burning) {
                ctx.beginPath();
                ctx.ellipse(-meatWidth * 0.15, -meatLength * 0.2, meatWidth * 0.25, meatLength * 0.2, -0.3, 0, Math.PI * 2);
                const highlightGradient = ctx.createRadialGradient(-meatWidth * 0.15, -meatLength * 0.2, 0, -meatWidth * 0.15, -meatLength * 0.2, meatWidth * 0.3);
                highlightGradient.addColorStop(0, 'rgba(255, 230, 150, 0.7)');
                highlightGradient.addColorStop(0.5, 'rgba(255, 200, 100, 0.3)');
                highlightGradient.addColorStop(1, 'rgba(255, 180, 80, 0)');
                ctx.fillStyle = highlightGradient;
                ctx.fill();
            }
            
            ctx.beginPath();
            ctx.ellipse(0, 0, meatWidth / 2, meatLength / 2, 0, 0, Math.PI * 2);
            ctx.strokeStyle = burning ? `rgb(${Math.max(30, 139 - burnProgress * 120)}, ${Math.max(20, 69 - burnProgress * 60)}, ${Math.max(10, 19 - burnProgress * 15)})` : '#8b4513';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();
        }
        
        function drawPegs() {
            for (let peg of pegs) {
                if (peg.y < canvas.height + 50) {
                    drawChickenDrumette(peg.x, peg.y, peg.radius, peg.rotation, peg.burning, peg.burnTimer);
                    if (peg.burning && peg.burnTimer < 2) {
                        for (let i = 0; i < 3; i++) {
                            const flameX = peg.x + (Math.random() - 0.5) * 20;
                            const flameY = peg.y - 10 - Math.random() * 15;
                            const flameSize = 8 + Math.random() * 12;
                            const gradient = ctx.createRadialGradient(flameX, flameY, 0, flameX, flameY, flameSize);
                            gradient.addColorStop(0, 'rgba(255, 255, 100, 0.9)');
                            gradient.addColorStop(0.3, 'rgba(255, 150, 0, 0.7)');
                            gradient.addColorStop(0.7, 'rgba(255, 50, 0, 0.4)');
                            gradient.addColorStop(1, 'rgba(255, 0, 0, 0)');
                            ctx.beginPath();
                            ctx.arc(flameX, flameY, flameSize, 0, Math.PI * 2);
                            ctx.fillStyle = gradient;
                            ctx.fill();
                        }
                    }
                }
            }
        }
        
        function drawVolcano() {
            const vx = VOLCANO_X;
            const vy = VOLCANO_TOP_Y;
            const baseWidth = 220;
            const topWidth = 60;
            
            // Lava pool at base
            ctx.beginPath();
            ctx.ellipse(vx, canvas.height - 5, baseWidth + 30, 15, 0, 0, Math.PI * 2);
            const lavaPoolGradient = ctx.createRadialGradient(vx, canvas.height - 5, 0, vx, canvas.height - 5, baseWidth + 30);
            lavaPoolGradient.addColorStop(0, '#ffcc00');
            lavaPoolGradient.addColorStop(0.4, '#ff8800');
            lavaPoolGradient.addColorStop(0.7, '#ff4400');
            lavaPoolGradient.addColorStop(1, '#cc2200');
            ctx.fillStyle = lavaPoolGradient;
            ctx.fill();
            
            // Main volcano body
            ctx.beginPath();
            ctx.moveTo(vx - baseWidth, canvas.height);
            ctx.lineTo(vx - topWidth - 20, vy + 25);
            ctx.lineTo(vx - topWidth, vy);
            ctx.lineTo(vx + topWidth, vy);
            ctx.lineTo(vx + topWidth + 20, vy + 25);
            ctx.lineTo(vx + baseWidth, canvas.height);
            ctx.closePath();
            
            const bodyGradient = ctx.createLinearGradient(vx - baseWidth, vy, vx + baseWidth, vy);
            bodyGradient.addColorStop(0, '#3d2b24');
            bodyGradient.addColorStop(0.2, '#4a3530');
            bodyGradient.addColorStop(0.5, '#5c4238');
            bodyGradient.addColorStop(0.8, '#4a3530');
            bodyGradient.addColorStop(1, '#3d2b24');
            ctx.fillStyle = bodyGradient;
            ctx.fill();
            
            // Dark crevices
            ctx.fillStyle = '#2a1d18';
            ctx.beginPath();
            ctx.moveTo(vx - 80, canvas.height);
            ctx.lineTo(vx - 40, vy + 80);
            ctx.lineTo(vx - 30, vy + 80);
            ctx.lineTo(vx - 60, canvas.height);
            ctx.fill();
            
            ctx.beginPath();
            ctx.moveTo(vx + 60, canvas.height);
            ctx.lineTo(vx + 30, vy + 100);
            ctx.lineTo(vx + 40, vy + 100);
            ctx.lineTo(vx + 80, canvas.height);
            ctx.fill();
            
            ctx.beginPath();
            ctx.moveTo(vx + 120, canvas.height);
            ctx.lineTo(vx + 55, vy + 60);
            ctx.lineTo(vx + 65, vy + 60);
            ctx.lineTo(vx + 150, canvas.height);
            ctx.fill();
            
            // Lava streams
            const lavaStreams = [
                {startX: -25, endX: -100, cp1x: -50, cp1y: 80, cp2x: -80, cp2y: 150, width: 12},
                {startX: 0, endX: 30, cp1x: 10, cp1y: 100, cp2x: 25, cp2y: 180, width: 10},
                {startX: 25, endX: 120, cp1x: 50, cp1y: 70, cp2x: 90, cp2y: 140, width: 14},
                {startX: -15, endX: -60, cp1x: -30, cp1y: 120, cp2x: -50, cp2y: 200, width: 8},
                {startX: 15, endX: 80, cp1x: 35, cp1y: 130, cp2x: 60, cp2y: 200, width: 9},
                {startX: -35, endX: -150, cp1x: -70, cp1y: 90, cp2x: -120, cp2y: 160, width: 11},
                {startX: 40, endX: 170, cp1x: 80, cp1y: 100, cp2x: 140, cp2y: 180, width: 10},
            ];
            
            for (let stream of lavaStreams) {
                ctx.beginPath();
                ctx.moveTo(vx + stream.startX, vy + 30);
                ctx.bezierCurveTo(
                    vx + stream.cp1x, vy + stream.cp1y,
                    vx + stream.cp2x, vy + stream.cp2y,
                    vx + stream.endX, canvas.height
                );
                ctx.lineWidth = stream.width + 6;
                ctx.strokeStyle = 'rgba(255, 100, 0, 0.3)';
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(vx + stream.startX, vy + 30);
                ctx.bezierCurveTo(
                    vx + stream.cp1x, vy + stream.cp1y,
                    vx + stream.cp2x, vy + stream.cp2y,
                    vx + stream.endX, canvas.height
                );
                const streamGradient = ctx.createLinearGradient(vx + stream.startX, vy + 30, vx + stream.endX, canvas.height);
                streamGradient.addColorStop(0, '#ffdd00');
                streamGradient.addColorStop(0.3, '#ffaa00');
                streamGradient.addColorStop(0.6, '#ff6600');
                streamGradient.addColorStop(1, '#ff4400');
                ctx.lineWidth = stream.width;
                ctx.strokeStyle = streamGradient;
                ctx.lineCap = 'round';
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(vx + stream.startX, vy + 30);
                ctx.bezierCurveTo(
                    vx + stream.cp1x, vy + stream.cp1y,
                    vx + stream.cp2x, vy + stream.cp2y,
                    vx + stream.endX, canvas.height
                );
                ctx.lineWidth = stream.width * 0.4;
                ctx.strokeStyle = '#ffff88';
                ctx.stroke();
            }
            
            // Crater rim
            ctx.beginPath();
            ctx.moveTo(vx - topWidth - 30, vy + 30);
            ctx.quadraticCurveTo(vx - topWidth - 15, vy - 10, vx - topWidth, vy);
            ctx.lineTo(vx + topWidth, vy);
            ctx.quadraticCurveTo(vx + topWidth + 15, vy - 10, vx + topWidth + 30, vy + 30);
            ctx.lineTo(vx + topWidth + 20, vy + 35);
            ctx.lineTo(vx - topWidth - 20, vy + 35);
            ctx.closePath();
            
            const rimGradient = ctx.createLinearGradient(vx, vy - 10, vx, vy + 35);
            rimGradient.addColorStop(0, '#ff6622');
            rimGradient.addColorStop(0.3, '#ee5511');
            rimGradient.addColorStop(0.6, '#cc4400');
            rimGradient.addColorStop(1, '#883311');
            ctx.fillStyle = rimGradient;
            ctx.fill();
            
            // Bright lava lip
            ctx.beginPath();
            ctx.moveTo(vx - topWidth + 5, vy + 5);
            ctx.quadraticCurveTo(vx, vy - 5, vx + topWidth - 5, vy + 5);
            ctx.strokeStyle = '#ffcc00';
            ctx.lineWidth = 4;
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(vx - topWidth + 10, vy + 8);
            ctx.quadraticCurveTo(vx, vy, vx + topWidth - 10, vy + 8);
            ctx.strokeStyle = '#ffff66';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // Crater hole
            ctx.beginPath();
            ctx.ellipse(vx, vy + 15, topWidth - 5, 18, 0, 0, Math.PI * 2);
            const craterGradient = ctx.createRadialGradient(vx, vy + 15, 0, vx, vy + 15, topWidth);
            craterGradient.addColorStop(0, '#ffff55');
            craterGradient.addColorStop(0.3, '#ffcc00');
            craterGradient.addColorStop(0.5, '#ff8800');
            craterGradient.addColorStop(0.7, '#ff4400');
            craterGradient.addColorStop(1, '#661100');
            ctx.fillStyle = craterGradient;
            ctx.fill();
            
            // Center glow
            ctx.beginPath();
            ctx.ellipse(vx, vy + 10, topWidth - 25, 10, 0, 0, Math.PI * 2);
            const centerGlow = ctx.createRadialGradient(vx, vy + 10, 0, vx, vy + 10, topWidth - 25);
            centerGlow.addColorStop(0, '#ffffff');
            centerGlow.addColorStop(0.3, '#ffffaa');
            centerGlow.addColorStop(0.6, '#ffdd00');
            centerGlow.addColorStop(1, '#ff8800');
            ctx.fillStyle = centerGlow;
            ctx.fill();
        }
        
        function drawSmoke() {
            for (let i = 0; i < smokeParticles.length; i++) {
                const p = smokeParticles[i];
                p.x += p.speedX;
                p.y += p.speedY;
                p.life -= p.decay;
                p.size *= 1.01;
                
                if (p.life <= 0) {
                    smokeParticles[i] = createSmokeParticle();
                    continue;
                }
                
                const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
                gradient.addColorStop(0, `rgba(90, 75, 70, ${p.life * 0.8})`);
                gradient.addColorStop(0.4, `rgba(75, 65, 60, ${p.life * 0.6})`);
                gradient.addColorStop(0.7, `rgba(60, 50, 45, ${p.life * 0.4})`);
                gradient.addColorStop(1, `rgba(50, 40, 35, 0)`);
                
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();
            }
            
            if (Math.random() < 0.3 && !explosion) {
                lavaDroplets.push(createLavaDroplet());
            }
            
            for (let i = lavaDroplets.length - 1; i >= 0; i--) {
                const d = lavaDroplets[i];
                d.x += d.speedX;
                d.y += d.speedY;
                d.speedY += 0.4;
                d.life -= 0.02;
                
                if (d.life <= 0 || d.y > canvas.height) {
                    lavaDroplets.splice(i, 1);
                    continue;
                }
                
                ctx.beginPath();
                ctx.arc(d.x, d.y, d.size, 0, Math.PI * 2);
                const dropGradient = ctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, d.size);
                dropGradient.addColorStop(0, '#ffff66');
                dropGradient.addColorStop(0.4, '#ffaa00');
                dropGradient.addColorStop(1, '#ff4400');
                ctx.fillStyle = dropGradient;
                ctx.fill();
            }
        }
        
        function updateExplosion() {
            if (!explosion) return;
            
            explosionIntensity += 0.02;
            if (screenShake > 0) screenShake -= 0.5;
            
            if (explosionIntensity < 1.5) {
                for (let i = 0; i < 3; i++) {
                    fireParticles.push(createExplosionParticle(
                        Math.random() * canvas.width,
                        canvas.height + 50
                    ));
                }
            }
            
            for (let i = fireParticles.length - 1; i >= 0; i--) {
                const p = fireParticles[i];
                p.x += p.speedX;
                p.y += p.speedY;
                p.speedY += 0.1;
                p.life -= p.decay;
                if (p.life <= 0) {
                    fireParticles.splice(i, 1);
                }
            }
            
            if (explosionIntensity > 0.3) {
                for (let peg of pegs) {
                    if (!peg.burning && Math.random() < 0.05) {
                        peg.burning = true;
                    }
                }
            }
            
            for (let peg of pegs) {
                if (peg.burning) {
                    peg.burnTimer += 0.02;
                    if (peg.burnTimer > 1 && !peg.falling) {
                        peg.falling = true;
                        peg.fallSpeed = 1 + Math.random() * 2;
                        peg.fallRotation = (Math.random() - 0.5) * 0.2;
                    }
                    if (peg.falling) {
                        peg.y += peg.fallSpeed;
                        peg.fallSpeed += 0.3;
                        peg.rotation += peg.fallRotation;
                    }
                }
            }
        }
        
        function drawExplosion() {
            if (!explosion) return;
            
            if (screenShake > 0) {
                ctx.save();
                ctx.translate(
                    (Math.random() - 0.5) * screenShake,
                    (Math.random() - 0.5) * screenShake
                );
            }
            
            const fireOverlay = ctx.createLinearGradient(0, canvas.height, 0, 0);
            const intensity = Math.min(explosionIntensity, 1);
            fireOverlay.addColorStop(0, `rgba(255, 50, 0, ${intensity * 0.8})`);
            fireOverlay.addColorStop(0.3, `rgba(255, 100, 0, ${intensity * 0.5})`);
            fireOverlay.addColorStop(0.6, `rgba(255, 150, 0, ${intensity * 0.3})`);
            fireOverlay.addColorStop(1, `rgba(255, 200, 0, ${intensity * 0.1})`);
            ctx.fillStyle = fireOverlay;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            for (let p of fireParticles) {
                const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
                gradient.addColorStop(0, `rgba(255, 255, 150, ${p.life})`);
                gradient.addColorStop(0.3, `rgba(255, 200, 50, ${p.life * 0.8})`);
                gradient.addColorStop(0.6, `rgba(255, 100, 0, ${p.life * 0.5})`);
                gradient.addColorStop(1, `rgba(255, 50, 0, 0)`);
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();
            }
            
            if (screenShake > 0) {
                ctx.restore();
            }
        }
        
        function drawBackground() {
            const skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            skyGradient.addColorStop(0, '#87CEEB');
            skyGradient.addColorStop(0.5, '#B0E0E6');
            skyGradient.addColorStop(1, '#FFE4C4');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        
        function gameLoop() {
            frameCount++;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            drawBackground();
            drawSmoke();
            drawVolcano();
            drawPegs();
            
            if (ball) {
                if (gameActive) {
                    ball.update();
                }
                ball.draw();
            }
            
            updateExplosion();
            drawExplosion();
            
            requestAnimationFrame(gameLoop);
        }
        
        startButton.addEventListener('click', function() {
            startButton.disabled = true;
            gamesPlayed++;
            gamesPlayedSpan.textContent = gamesPlayed;
            gameOver = false;
            explosion = false;
            explosionIntensity = 0;
            screenShake = 0;
            fireParticles = [];
            lavaDroplets = [];
            initSmokeParticles();
            createPegs();
            ball = new Ball();
            gameActive = true;
            statusText.textContent = 'Click to drop the ball!';
            statusText.style.color = '#667eea';
        });
        
        canvas.addEventListener('click', function() {
            if (gameActive && ball && !ball.dropped) {
                ball.drop();
                statusText.textContent = '🌋 Falling...';
            }
        });
        
        gameLoop();
    </script>
</body>
</html>
