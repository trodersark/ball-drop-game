<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ball Drop Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#1a1a2e,#16213e);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px
}
.container{
    background:#fff;
    border-radius:20px;
    padding:30px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
    max-width:600px;
    width:100%
}
h1{text-align:center;color:#667eea;margin-bottom:15px}
canvas{
    display:block;
    margin:0 auto;
    border:4px solid #667eea;
    border-radius:12px;
    cursor:pointer
}
.controls{text-align:center;margin-top:15px}
button{
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:#fff;
    border:none;
    padding:14px 28px;
    font-size:18px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold
}
button:disabled{background:#aaa}
.info{text-align:center;margin-top:15px}
.status{font-size:20px;font-weight:bold}
</style>
</head>
<body>

<div class="container">
<h1>🍗 Ball Drop Game 🍗</h1>
<canvas id="gameCanvas" width="500" height="700"></canvas>
<div class="controls">
<button id="startButton">Start Game</button>
</div>
<div class="info">
<p class="status" id="status">Click Start Game!</p>
<p>Games: <span id="gamesPlayed">0</span></p>
</div>
</div>

<script>
const canvas=document.getElementById("gameCanvas");
const ctx=canvas.getContext("2d");
const startButton=document.getElementById("startButton");
const statusText=document.getElementById("status");
const gamesPlayedSpan=document.getElementById("gamesPlayed");

let ball=null,gameActive=false,gameOver=false,playerWon=false;
let gamesPlayed=0,fireIntensity=1;
let frameCount=0;

const BALL_RADIUS=12,GRAVITY=.35;
const VOLCANO_X=canvas.width/2;
const VOLCANO_Y=canvas.height-180;
const PEG_RADIUS=12,PEG_ROWS=7,PEG_COLS=9;
const pegs=[];
let fireParticles=[],smokeParticles=[],waterParticles=[],steamParticles=[];

/* ================= PEGS ================= */
function createPegs(){
    const startY=100,spY=48,spX=55;
    for(let r=0;r<PEG_ROWS;r++){
        const cols=r%2===0?PEG_COLS:PEG_COLS-1;
        const off=r%2===0?25:52;
        for(let c=0;c<cols;c++){
            pegs.push({
                x:off+c*spX,
                y:startY+r*spY,
                radius:PEG_RADIUS,
                rotation:(Math.random()-.5)*.6,
                lastHit:0
            });
        }
    }
}
createPegs();

/* ================= BALL ================= */
class Ball{
constructor(){
    this.x=canvas.width/2;
    this.y=50;
    this.vx=4;
    this.vy=0;
    this.radius=BALL_RADIUS;
    this.dropped=false;
    this.sprayingWater=false;
}
drop(){this.dropped=true}
update(){
    if(!this.dropped){
        this.x+=this.vx;
        if(this.x<this.radius||this.x>canvas.width-this.radius) this.vx*=-1;
        return;
    }
    this.vy+=GRAVITY;
    this.x+=this.vx;
    this.y+=this.vy;

    for(let p of pegs){
        const dx=this.x-p.x,dy=this.y-p.y;
        const d=Math.hypot(dx,dy);
        if(d<this.radius+p.radius && frameCount-p.lastHit>10){
            p.lastHit=frameCount;
            const a=Math.atan2(dy,dx);
            this.vx=Math.cos(a)*3;
            this.vy=Math.sin(a)*3;
        }
    }

    if(this.y>VOLCANO_Y){
        if(Math.abs(this.x-VOLCANO_X)<45){
            playerWon=true;
            this.sprayingWater=true;
            statusText.textContent="💧 Splash! Fire Out!";
            statusText.style.color="#3b82f6";
        }else{
            statusText.textContent="🔥 Burned! Try again!";
            statusText.style.color="#dc3545";
        }
        gameActive=false;
        startButton.disabled=false;
    }
}
draw(){
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.radius,0,Math.PI*2);
    ctx.fillStyle=this.sprayingWater?"#3b82f6":"#e63946";
    ctx.fill();
    ctx.lineWidth=2;
    ctx.strokeStyle="#000";
    ctx.stroke();
}
}

/* ================= CHICKEN DRUMETTE ================= */
function drawChickenDrumette(x,y,r,rot){
ctx.save();
ctx.translate(x,y);
ctx.rotate(rot);
const w=r*1.6,h=r*2.4;

/* shadow */
ctx.fillStyle="rgba(0,0,0,.25)";
ctx.beginPath();
ctx.ellipse(4,6,w/2,h/2,0,0,Math.PI*2);
ctx.fill();

/* meat */
ctx.beginPath();
ctx.ellipse(0,0,w/2,h/2,0,0,Math.PI*2);
const g=ctx.createRadialGradient(-w*.2,-h*.3,0,0,0,h);
g.addColorStop(0,"#ffcc7a");
g.addColorStop(.4,"#f1a94d");
g.addColorStop(.7,"#d07a2d");
g.addColorStop(1,"#8b4513");
ctx.fillStyle=g;
ctx.fill();

/* crispy bumps */
ctx.fillStyle="rgba(120,60,20,.35)";
for(let i=0;i<8;i++){
    ctx.beginPath();
    ctx.arc((Math.random()-.5)*w*.7,(Math.random()-.5)*h*.7,2+Math.random()*2,0,Math.PI*2);
    ctx.fill();
}

/* highlight */
ctx.fillStyle="rgba(255,255,255,.35)";
ctx.beginPath();
ctx.ellipse(-w*.2,-h*.25,w*.25,h*.2,-.4,0,Math.PI*2);
ctx.fill();

/* bone */
ctx.fillStyle="#f7f3eb";
ctx.beginPath();
ctx.roundRect(-r*.25,h/2-5,r*.5,r*1.2,6);
ctx.fill();
ctx.strokeStyle="#d6c9b8";
ctx.stroke();

/* outline */
ctx.beginPath();
ctx.ellipse(0,0,w/2,h/2,0,0,Math.PI*2);
ctx.lineWidth=3;
ctx.strokeStyle="#6b2f10";
ctx.stroke();
ctx.restore();
}

function drawPegs(){
    pegs.forEach(p=>drawChickenDrumette(p.x,p.y,p.radius,p.rotation));
}

/* ================= CARTOON VOLCANO ================= */
function drawVolcano(){
const vx=VOLCANO_X,vy=VOLCANO_Y;
ctx.save();

/* body */
ctx.beginPath();
ctx.moveTo(vx-220,canvas.height);
ctx.quadraticCurveTo(vx-180,vy+120,vx-90,vy+40);
ctx.quadraticCurveTo(vx-40,vy-20,vx-40,vy-40);
ctx.lineTo(vx+40,vy-40);
ctx.quadraticCurveTo(vx+40,vy-20,vx+90,vy+40);
ctx.quadraticCurveTo(vx+180,vy+120,vx+220,canvas.height);
ctx.closePath();

const g=ctx.createLinearGradient(vx,vy-50,vx,canvas.height);
g.addColorStop(0,"#6b4e3d");
g.addColorStop(1,"#3d2a20");
ctx.fillStyle=g;
ctx.fill();
ctx.lineWidth=5;
ctx.strokeStyle="#2a1a14";
ctx.stroke();

/* crater */
ctx.beginPath();
ctx.ellipse(vx,vy-35,65,22,0,0,Math.PI*2);
ctx.fillStyle="#2b0b05";
ctx.fill();
ctx.strokeStyle="#ff6a00";
ctx.lineWidth=4;
ctx.stroke();

/* lava */
if(fireIntensity>0){
ctx.beginPath();
ctx.ellipse(vx,vy-30,50,16,0,0,Math.PI*2);
const lg=ctx.createRadialGradient(vx,vy-30,5,vx,vy-30,55);
lg.addColorStop(0,`rgba(255,255,120,${fireIntensity})`);
lg.addColorStop(.6,`rgba(255,120,0,${fireIntensity})`);
lg.addColorStop(1,`rgba(180,30,0,${fireIntensity})`);
ctx.fillStyle=lg;
ctx.fill();
}
ctx.restore();
}

/* ================= BACKGROUND ================= */
function drawBackground(){
const g=ctx.createLinearGradient(0,0,0,canvas.height);
g.addColorStop(0,"#87ceeb");
g.addColorStop(1,"#e0f4ff");
ctx.fillStyle=g;
ctx.fillRect(0,0,canvas.width,canvas.height);
}

/* ================= LOOP ================= */
function gameLoop(){
frameCount++;
ctx.clearRect(0,0,canvas.width,canvas.height);
drawBackground();
drawVolcano();
drawPegs();
if(ball){
    if(gameActive) ball.update();
    ball.draw();
}
requestAnimationFrame(gameLoop);
}

/* ================= EVENTS ================= */
startButton.onclick=()=>{
    gamesPlayed++;
    gamesPlayedSpan.textContent=gamesPlayed;
    fireIntensity=1;
    playerWon=false;
    ball=new Ball();
    gameActive=true;
    startButton.disabled=true;
    statusText.textContent="Click to drop!";
    statusText.style.color="#667eea";
};

canvas.onclick=()=>{
    if(ball && !ball.dropped && gameActive) ball.drop();
};

gameLoop();
</script>
</body>
</html>
