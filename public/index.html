<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egg Drop Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        #gameCanvas {
            border: 3px solid #667eea;
            border-radius: 10px;
            display: block;
            margin: 20px auto;
            background: radial-gradient(circle at 30% 30%, #e0e7ff, #b8c5f0);
            cursor: pointer;
            box-shadow: inset 0 5px 15px rgba(0,0,0,0.1);
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s;
        }
        button:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        button:disabled { 
            background: #ccc; 
            cursor: not-allowed;
            transform: none;
        }
        .info {
            text-align: center;
            margin: 15px 0;
            padding: 15px;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 10px;
        }
        .status {
            font-weight: bold;
            font-size: 20px;
            color: #667eea;
        }
        .difficulty {
            color: #dc3545;
            font-size: 14px;
            font-weight: bold;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍗 Egg Drop Game 🥚</h1>
        <canvas id="gameCanvas" width="500" height="600"></canvas>
        <div class="controls">
            <button id="startButton">Start Game</button>
        </div>
        <div class="info">
            <p class="status" id="status">Click Start Game!</p>
            <p class="difficulty">🍗 Dodge the wings! Land in the nest! 🪹</p>
            <p>Games: <span id="gamesPlayed">0</span></p>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startButton = document.getElementById('startButton');
        const statusText = document.getElementById('status');
        const gamesPlayedSpan = document.getElementById('gamesPlayed');
        
        let ball = null;
        let gameActive = false;
        let gamesPlayed = 0;
        let gameOver = false;
        
        const BALL_RADIUS = 18;
        const BALL_SPEED = 8;
        const GRAVITY = 0.4;
        const HOLE_WIDTH = 50;
        const HOLE_Y = canvas.height - 40;

        const PEG_RADIUS = 12;
        const PEG_ROWS = 6;
        const PEG_COLS = 7;
        const pegs = [];

        function createPegs() {
            const startY = 140;
            const spacingY = 60;
            const spacingX = 70;
            
            for (let row = 0; row < PEG_ROWS; row++) {
                const cols = row % 2 === 0 ? PEG_COLS : PEG_COLS - 1;
                const offsetX = row % 2 === 0 ? 35 : 70;
                
                for (let col = 0; col < cols; col++) {
                    const x = offsetX + col * spacingX;
                    const y = startY + row * spacingY;
                    const rotation = Math.random() * Math.PI * 2;
                    pegs.push({ x, y, radius: PEG_RADIUS, rotation });
                }
            }
        }
        createPegs();
        
        class Ball {
            constructor() {
                this.x = canvas.width / 2;
                this.y = 60;
                this.vx = BALL_SPEED;
                this.vy = 0;
                this.radius = BALL_RADIUS;
                this.dropped = false;
                this.rotation = 0;
                this.hitPegs = [];
            }
            
            update() {
                if (!this.dropped) {
                    this.x += this.vx;
                    if (this.x - this.radius < 0 || this.x + this.radius > canvas.width) {
                        this.vx *= -1;
                    }
                } else {
                    this.vy += GRAVITY;
                    this.x += this.vx;
                    this.y += this.vy;
                    this.rotation += this.vx * 0.05;
                    
                    for (let i = 0; i < pegs.length; i++) {
                        const peg = pegs[i];
                        const dx = this.x - peg.x;
                        const dy = this.y - peg.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        
                        if (distance < this.radius + peg.radius) {
                            const angle = Math.atan2(dy, dx);
                            
                            // Push egg away from peg
                            this.x = peg.x + Math.cos(angle) * (this.radius + peg.radius + 5);
                            this.y = peg.y + Math.sin(angle) * (this.radius + peg.radius + 5);
                            
                            // Bounce with randomness - always go down
                            this.vx = Math.cos(angle) * 3 + (Math.random() - 0.5) * 4;
                            this.vy = Math.abs(Math.sin(angle) * 2) + 2;
                        }
                    }
                    
                    if (this.x - this.radius < 0) {
                        this.x = this.radius;
                        this.vx *= -0.8;
                    }
                    if (this.x + this.radius > canvas.width) {
                        this.x = canvas.width - this.radius;
                        this.vx *= -0.8;
                    }
                    
                    if (this.y + this.radius >= HOLE_Y) {
                        this.checkWin();
                        return true;
                    }
                }
                return false;
            }
            
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                
                // Shadow
                ctx.beginPath();
                ctx.ellipse(4, 4, this.radius * 0.7, this.radius, 0, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.fill();
                
                // Egg shape
                ctx.beginPath();
                ctx.ellipse(0, 0, this.radius * 0.7, this.radius, 0, 0, Math.PI * 2);
                
                const gradient = ctx.createRadialGradient(-5, -5, 0, 0, 0, this.radius);
                gradient.addColorStop(0, '#fffef5');
                gradient.addColorStop(0.5, '#f5e6c8');
                gradient.addColorStop(1, '#e8d4a8');
                
                ctx.fillStyle = gradient;
                ctx.fill();
                
                // Highlight
                ctx.beginPath();
                ctx.ellipse(-5, -8, 6, 8, -0.3, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.fill();
                
                // Outline
                ctx.beginPath();
                ctx.ellipse(0, 0, this.radius * 0.7, this.radius, 0, 0, Math.PI * 2);
                ctx.strokeStyle = '#d4c4a4';
                ctx.lineWidth = 1.5;
                ctx.stroke();
                
                ctx.restore();
            }
            
            drop() {
                this.dropped = true;
            }
            
            checkWin() {
                const holeCenter = canvas.width / 2;
                const distance = Math.abs(this.x - holeCenter);
                if (distance < HOLE_WIDTH / 2) {
                    statusText.textContent = '🎉 EGG-CELLENT! YOU WIN! 🥚';
                    statusText.style.color = '#10b981';
                } else {
                    statusText.textContent = '🍳 Scrambled! Try again!';
                    statusText.style.color = '#dc3545';
                }
                gameActive = false;
                gameOver = true;
                startButton.disabled = false;
            }
        }
        
        function drawChickenWing(x, y, radius, rotation) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rotation);
            
            // Shadow
            ctx.beginPath();
            ctx.ellipse(3, 3, radius * 1.2, radius * 0.6, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fill();
            
            // Wing body
            ctx.beginPath();
            ctx.ellipse(0, 0, radius * 1.2, radius * 0.6, 0, 0, Math.PI * 2);
            
            const gradient = ctx.createRadialGradient(-3, -2, 0, 0, 0, radius * 1.2);
            gradient.addColorStop(0, '#e8a849');
            gradient.addColorStop(0.5, '#c46d1d');
            gradient.addColorStop(1, '#8b4513');
            
            ctx.fillStyle = gradient;
            ctx.fill();
            
            // Highlight
            ctx.beginPath();
            ctx.ellipse(-radius * 0.4, -radius * 0.15, radius * 0.35, radius * 0.2, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 200, 100, 0.5)';
            ctx.fill();
            
            // Bone
            ctx.beginPath();
            ctx.ellipse(radius * 1.1, 0, radius * 0.25, radius * 0.15, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#f5f5dc';
            ctx.fill();
            ctx.strokeStyle = '#d4c8a0';
            ctx.lineWidth = 1;
            ctx.stroke();
            
            ctx.restore();
        }
        
        function drawPegs() {
            for (let peg of pegs) {
                drawChickenWing(peg.x, peg.y, peg.radius, peg.rotation);
            }
        }
        
        function draw3DHole() {
            const center = canvas.width / 2;
            
            // Nest border
            ctx.fillStyle = '#3e2723';
            ctx.fillRect(center - HOLE_WIDTH/2 - 5, HOLE_Y - 5, HOLE_WIDTH + 10, 40);
            
            // Nest
            const nestGradient = ctx.createLinearGradient(center - HOLE_WIDTH/2, HOLE_Y, center + HOLE_WIDTH/2, HOLE_Y);
            nestGradient.addColorStop(0, '#5d4037');
            nestGradient.addColorStop(0.5, '#8d6e63');
            nestGradient.addColorStop(1, '#5d4037');
            
            ctx.fillStyle = nestGradient;
            ctx.fillRect(center - HOLE_WIDTH / 2, HOLE_Y, HOLE_WIDTH, 30);
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.fillRect(center - HOLE_WIDTH / 2, HOLE_Y, HOLE_WIDTH, 5);
            
            ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
            ctx.shadowBlur = 3;
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 14px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('🪹 NEST', center, HOLE_Y + 20);
            ctx.shadowBlur = 0;
            
            // Frying pans (lose zones)
            const panGradient = ctx.createLinearGradient(0, HOLE_Y, canvas.width, HOLE_Y);
            panGradient.addColorStop(0, '#2c2c2c');
            panGradient.addColorStop(0.5, '#4a4a4a');
            panGradient.addColorStop(1, '#2c2c2c');
            
            ctx.fillStyle = panGradient;
            ctx.fillRect(0, HOLE_Y, center - HOLE_WIDTH / 2, 30);
            ctx.fillRect(center + HOLE_WIDTH / 2, HOLE_Y, canvas.width - (center + HOLE_WIDTH / 2), 30);
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.fillRect(0, HOLE_Y, center - HOLE_WIDTH / 2, 5);
            ctx.fillRect(center + HOLE_WIDTH / 2, HOLE_Y, canvas.width - (center + HOLE_WIDTH / 2), 5);
            
            ctx.font = '16px Arial';
            ctx.fillText('🍳', 60, HOLE_Y + 20);
            ctx.fillText('🍳', canvas.width - 60, HOLE_Y + 20);
        }
        
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (gameOver) {
                draw3DHole();
            }
            
            drawPegs();
            
            if (ball && gameActive) {
                const finished = ball.update();
                ball.draw();
                
                if (!finished) {
                    requestAnimationFrame(gameLoop);
                }
            }
        }
        
        startButton.addEventListener('click', function() {
            startButton.disabled = true;
            gamesPlayed++;
            gamesPlayedSpan.textContent = gamesPlayed;
            gameOver = false;
            ball = new Ball();
            gameActive = true;
            statusText.textContent = 'Click to drop the egg!';
            statusText.style.color = '#667eea';
            gameLoop();
        });
        
        canvas.addEventListener('click', function() {
            if (gameActive && ball && !ball.dropped) {
                ball.drop();
                statusText.textContent = '🥚 Egg falling...';
            }
        });
        
        drawPegs();
    </script>
</body>
</html>
