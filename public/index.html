<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ball Drop Game – Inferno Mode</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    background:radial-gradient(circle at top,#2a0a0a,#000);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial,sans-serif;
}
.container{
    background:#fff;
    padding:20px;
    border-radius:18px;
    box-shadow:0 20px 60px rgba(0,0,0,.6);
    width:560px;
}
h1{text-align:center;margin-bottom:10px}
canvas{
    display:block;
    margin:auto;
    border:4px solid #8b0000;
    border-radius:12px;
}
button{
    display:block;
    margin:15px auto 0;
    padding:12px 28px;
    font-size:18px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#b91c1c,#7f1d1d);
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}
button:disabled{opacity:.5}
.status{text-align:center;font-size:20px;margin-top:10px;font-weight:bold}
</style>
</head>
<body>

<div class="container">
<h1>🍗 Ball Drop – Inferno 🌋</h1>
<canvas id="gameCanvas" width="500" height="700"></canvas>
<button id="startBtn">Start Game</button>
<div class="status" id="status">Drop the ball…</div>
</div>

<script>
/* ================= SETUP ================= */
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const statusText = document.getElementById("status");
const startBtn = document.getElementById("startBtn");

const VOLCANO_X = canvas.width/2;
const VOLCANO_Y = canvas.height-180;

let gameActive=false;
let ball=null;
let inferno=false;
let shake=0;

/* ================= AUDIO ================= */
const audioCtx = new (window.AudioContext||window.webkitAudioContext)();

function playBoom(freq,dur){
    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();
    o.connect(g).connect(audioCtx.destination);
    o.type="sawtooth";
    o.frequency.value=freq;
    g.gain.setValueAtTime(0.6,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
    o.start();
    o.stop(audioCtx.currentTime+dur);
}

function playFire(){
    const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<data.length;i++) data[i]=(Math.random()*2-1)*0.4;
    const src = audioCtx.createBufferSource();
    const g = audioCtx.createGain();
    src.buffer=buffer;
    src.loop=true;
    g.gain.value=0.25;
    src.connect(g).connect(audioCtx.destination);
    src.start();
    return src;
}

/* ================= BALL ================= */
class Ball{
    constructor(){
        this.x=canvas.width/2;
        this.y=60;
        this.vy=0;
        this.r=12;
        this.dropped=false;
    }
    drop(){
        this.dropped=true;
        playBoom(300,.1);
    }
    update(){
        if(!this.dropped) return;
        this.vy+=0.35;
        this.y+=this.vy;
        if(this.y>VOLCANO_Y && !inferno){
            inferno=true;
            shake=40;
            statusText.textContent="🔥 INFERNO 🔥";
            playBoom(60,1);
            fireSound=playFire();
            burnWings();
        }
    }
    draw(){
        ctx.beginPath();
        ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
        ctx.fillStyle="#dc2626";
        ctx.fill();
        ctx.strokeStyle="#000";
        ctx.stroke();
    }
}

/* ================= PEGS (WINGS) ================= */
const pegs=[];
for(let r=0;r<7;r++){
    for(let c=0;c<8;c++){
        pegs.push({
            x:60+c*50+(r%2?25:0),
            y:120+r*55,
            r:12,
            vy:0,
            burning:false,
            char:0
        });
    }
}

function burnWings(){
    pegs.forEach(p=>{
        p.burning=true;
        p.vy=Math.random()*4+2;
    });
}

/* ================= DRAW WING ================= */
function drawWing(p){
    ctx.save();
    ctx.translate(p.x,p.y);

    const w=p.r*1.6,h=p.r*2.4;
    const burn=Math.min(p.char,1);

    const g=ctx.createRadialGradient(0,-h*.2,0,0,0,h);
    g.addColorStop(0,`rgb(${255-150*burn},${200-150*burn},${80-80*burn})`);
    g.addColorStop(1,`rgb(${120*burn},${60*burn},${30*burn})`);

    ctx.beginPath();
    ctx.ellipse(0,0,w/2,h/2,0,0,Math.PI*2);
    ctx.fillStyle=g;
    ctx.fill();

    ctx.strokeStyle="#3a1a0a";
    ctx.lineWidth=3;
    ctx.stroke();
    ctx.restore();
}

/* ================= VOLCANO ================= */
function drawVolcano(){
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(VOLCANO_X-220,canvas.height);
    ctx.quadraticCurveTo(VOLCANO_X-100,VOLCANO_Y+50,VOLCANO_X-40,VOLCANO_Y-40);
    ctx.lineTo(VOLCANO_X+40,VOLCANO_Y-40);
    ctx.quadraticCurveTo(VOLCANO_X+100,VOLCANO_Y+50,VOLCANO_X+220,canvas.height);
    ctx.closePath();
    ctx.fillStyle="#4b2e23";
    ctx.fill();
    ctx.strokeStyle="#1b0d07";
    ctx.lineWidth=5;
    ctx.stroke();

    if(inferno){
        ctx.beginPath();
        ctx.rect(0,0,canvas.width,canvas.height);
        ctx.fillStyle="rgba(255,80,0,0.35)";
        ctx.fill();
    }
    ctx.restore();
}

/* ================= LOOP ================= */
let fireSound=null;

function loop(){
    ctx.save();
    if(shake>0){
        ctx.translate(
            (Math.random()-.5)*shake,
            (Math.random()-.5)*shake
        );
        shake*=0.9;
    }

    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="#87ceeb";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    drawVolcano();

    pegs.forEach(p=>{
        if(p.burning){
            p.char+=0.02;
            p.y+=p.vy;
        }
        drawWing(p);
    });

    if(ball){
        ball.update();
        ball.draw();
    }

    ctx.restore();
    requestAnimationFrame(loop);
}

/* ================= EVENTS ================= */
startBtn.onclick=()=>{
    inferno=false;
    pegs.forEach(p=>{
        p.y=p.y;
        p.burning=false;
        p.char=0;
    });
    ball=new Ball();
    gameActive=true;
    startBtn.disabled=true;
    statusText.textContent="Click to drop!";
};

canvas.onclick=()=>{
    if(ball && !ball.dropped) ball.drop();
};

loop();
</script>
</body>
</html>
