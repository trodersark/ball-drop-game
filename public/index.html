<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ball Drop Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        #gameCanvas {
            border: 3px solid #667eea;
            border-radius: 10px;
            display: block;
            margin: 20px auto;
            background: linear-gradient(to bottom, #1a1a2e 0%, #2d2d44 100%);
            cursor: pointer;
            box-shadow: inset 0 5px 15px rgba(0,0,0,0.1);
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s;
        }
        button:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        button:disabled { 
            background: #ccc; 
            cursor: not-allowed;
            transform: none;
        }
        .info {
            text-align: center;
            margin: 15px 0;
            padding: 15px;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 10px;
        }
        .status {
            font-weight: bold;
            font-size: 20px;
            color: #667eea;
        }
        .difficulty {
            color: #dc3545;
            font-size: 14px;
            font-weight: bold;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔥 Ball Drop Game 🔥</h1>
        <canvas id="gameCanvas" width="500" height="650"></canvas>
        <div class="controls">
            <button id="startButton">Start Game</button>
        </div>
        <div class="info">
            <p class="status" id="status">Click Start Game!</p>
            <p class="difficulty">🍗 Dodge the wings! Avoid the fire! 🔥</p>
            <p>Games: <span id="gamesPlayed">0</span></p>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startButton = document.getElementById('startButton');
        const statusText = document.getElementById('status');
        const gamesPlayedSpan = document.getElementById('gamesPlayed');
        
        let ball = null;
        let gameActive = false;
        let gamesPlayed = 0;
        let gameOver = false;
        
        const BALL_RADIUS = 12;
        const BALL_SPEED = 6;
        const GRAVITY = 0.3;
        const FIRE_Y = canvas.height - 80;

        const PEG_RADIUS = 10;
        const PEG_ROWS = 8;
        const PEG_COLS = 10;
        const pegs = [];
        
        // Fire particles
        const fireParticles = [];
        const smokeParticles = [];
        
        function createPegs() {
            const startY = 100;
            const spacingY = 45;
            const spacingX = 50;
            
            for (let row = 0; row < PEG_ROWS; row++) {
                const cols = row % 2 === 0 ? PEG_COLS : PEG_COLS - 1;
                const offsetX = row % 2 === 0 ? 25 : 50;
                
                for (let col = 0; col < cols; col++) {
                    const x = offsetX + col * spacingX;
                    const y = startY + row * spacingY;
                    const rotation = Math.random() * Math.PI * 2;
                    pegs.push({ x, y, radius: PEG_RADIUS, rotation, lastHit: 0 });
                }
            }
        }
        createPegs();
        
        // Initialize fire particles
        function createFireParticle() {
            return {
                x: Math.random() * canvas.width,
                y: FIRE_Y + Math.random() * 30,
                size: 20 + Math.random() * 40,
                speedY: -1 - Math.random() * 3,
                speedX: (Math.random() - 0.5) * 2,
                life: 1,
                decay: 0.01 + Math.random() * 0.02,
                hue: Math.random() * 60 // 0-60 for red to yellow
            };
        }
        
        function createSmokeParticle() {
            return {
                x: Math.random() * canvas.width,
                y: FIRE_Y - 20 - Math.random() * 30,
                size: 15 + Math.random() * 25,
                speedY: -0.5 - Math.random() * 1,
                speedX: (Math.random() - 0.5) * 1,
                life: 0.5,
                decay: 0.005 + Math.random() * 0.01
            };
        }
        
        // Fill initial particles
        for (let i = 0; i < 100; i++) {
            fireParticles.push(createFireParticle());
        }
        for (let i = 0; i < 30; i++) {
            smokeParticles.push(createSmokeParticle());
        }
        
        let frameCount = 0;
        
        class Ball {
            constructor() {
                this.x = canvas.width / 2;
                this.y = 50;
                this.vx = BALL_SPEED;
                this.vy = 0;
                this.radius = BALL_RADIUS;
                this.dropped = false;
                this.rotation = 0;
            }
            
            update() {
                if (!this.dropped) {
                    this.x += this.vx;
                    if (this.x - this.radius < 0 || this.x + this.radius > canvas.width) {
                        this.vx *= -1;
                    }
                } else {
                    this.vy += GRAVITY;
                    this.x += this.vx;
                    this.y += this.vy;
                    this.rotation += this.vx * 0.05;
                    
                    if (this.vy > 10) this.vy = 10;
                    
                    for (let peg of pegs) {
                        const dx = this.x - peg.x;
                        const dy = this.y - peg.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        
                        if (distance < this.radius + peg.radius && frameCount - peg.lastHit > 10) {
                            peg.lastHit = frameCount;
                            
                            const angle = Math.atan2(dy, dx);
                            
                            this.x = peg.x + Math.cos(angle) * (this.radius + peg.radius + 3);
                            this.y = peg.y + Math.sin(angle) * (this.radius + peg.radius + 3);
                            
                            this.vx = (Math.random() - 0.5) * 6;
                            this.vy = 2 + Math.random() * 2;
                        }
                    }
                    
                    if (this.x - this.radius < 0) {
                        this.x = this.radius;
                        this.vx = Math.abs(this.vx) * 0.8;
                    }
                    if (this.x + this.radius > canvas.width) {
                        this.x = canvas.width - this.radius;
                        this.vx = -Math.abs(this.vx) * 0.8;
                    }
                    
                    if (this.y + this.radius >= FIRE_Y) {
                        this.checkWin();
                        return true;
                    }
                }
                return false;
            }
            
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                
                // Shadow
                ctx.beginPath();
                ctx.arc(4, 4, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.fill();
                
                // Ball
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                
                const gradient = ctx.createRadialGradient(-4, -4, 0, 0, 0, this.radius);
                gradient.addColorStop(0, '#ff6b6b');
                gradient.addColorStop(0.3, '#ee5a52');
                gradient.addColorStop(0.7, '#dc3545');
                gradient.addColorStop(1, '#991b1b');
                
                ctx.fillStyle = gradient;
                ctx.fill();
                
                // Highlight
                ctx.beginPath();
                ctx.arc(-4, -4, this.radius * 0.4, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.fill();
                
                // Outline
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.strokeStyle = '#991b1b';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                ctx.restore();
            }
            
            drop() {
                this.dropped = true;
            }
            
            checkWin() {
                statusText.textContent = '🔥 Burned! Try again! 🔥';
                statusText.style.color = '#dc3545';
                gameActive = false;
                gameOver = true;
                startButton.disabled = false;
            }
        }
        
        function drawChickenWing(x, y, radius, rotation) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rotation);
            
            ctx.beginPath();
            ctx.ellipse(2, 2, radius * 1.2, radius * 0.6, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fill();
            
            ctx.beginPath();
            ctx.ellipse(0, 0, radius * 1.2, radius * 0.6, 0, 0, Math.PI * 2);
            
            const gradient = ctx.createRadialGradient(-2, -1, 0, 0, 0, radius * 1.2);
            gradient.addColorStop(0, '#e8a849');
            gradient.addColorStop(0.5, '#c46d1d');
            gradient.addColorStop(1, '#8b4513');
            
            ctx.fillStyle = gradient;
            ctx.fill();
            
            ctx.beginPath();
            ctx.ellipse(-radius * 0.4, -radius * 0.1, radius * 0.3, radius * 0.15, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 200, 100, 0.5)';
            ctx.fill();
            
            ctx.beginPath();
            ctx.ellipse(radius * 1.0, 0, radius * 0.2, radius * 0.12, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#f5f5dc';
            ctx.fill();
            ctx.strokeStyle = '#d4c8a0';
            ctx.lineWidth = 1;
            ctx.stroke();
            
            ctx.restore();
        }
        
        function drawPegs() {
            for (let peg of pegs) {
                drawChickenWing(peg.x, peg.y, peg.radius, peg.rotation);
            }
        }
        
        function updateAndDrawFire() {
            // Update and draw fire particles
            for (let i = 0; i < fireParticles.length; i++) {
                const p = fireParticles[i];
                
                p.x += p.speedX;
                p.y += p.speedY;
                p.life -= p.decay;
                p.size *= 0.99;
                
                if (p.life <= 0 || p.size < 2) {
                    fireParticles[i] = createFireParticle();
                    continue;
                }
                
                // Draw fire particle
                const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
                
                if (p.life > 0.7) {
                    // White/yellow core
                    gradient.addColorStop(0, `rgba(255, 255, 255, ${p.life})`);
                    gradient.addColorStop(0.2, `rgba(255, 255, 100, ${p.life * 0.9})`);
                    gradient.addColorStop(0.5, `rgba(255, 150, 0, ${p.life * 0.7})`);
                    gradient.addColorStop(1, `rgba(255, 50, 0, 0)`);
                } else if (p.life > 0.4) {
                    // Orange/red
                    gradient.addColorStop(0, `rgba(255, 200, 50, ${p.life})`);
                    gradient.addColorStop(0.3, `rgba(255, 100, 0, ${p.life * 0.8})`);
                    gradient.addColorStop(0.7, `rgba(200, 50, 0, ${p.life * 0.5})`);
                    gradient.addColorStop(1, `rgba(100, 0, 0, 0)`);
                } else {
                    // Dying ember
                    gradient.addColorStop(0, `rgba(255, 100, 0, ${p.life})`);
                    gradient.addColorStop(0.5, `rgba(150, 30, 0, ${p.life * 0.6})`);
                    gradient.addColorStop(1, `rgba(50, 0, 0, 0)`);
                }
                
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();
            }
            
            // Update and draw smoke particles
            for (let i = 0; i < smokeParticles.length; i++) {
                const p = smokeParticles[i];
                
                p.x += p.speedX;
                p.y += p.speedY;
                p.life -= p.decay;
                p.size *= 1.01;
                
                if (p.life <= 0) {
                    smokeParticles[i] = createSmokeParticle();
                    continue;
                }
                
                // Draw smoke
                const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
                gradient.addColorStop(0, `rgba(80, 80, 80, ${p.life * 0.3})`);
                gradient.addColorStop(0.5, `rgba(60, 60, 60, ${p.life * 0.2})`);
                gradient.addColorStop(1, `rgba(40, 40, 40, 0)`);
                
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();
            }
            
            // Draw base flames (more intense at bottom)
            for (let i = 0; i < 20; i++) {
                const x = (canvas.width / 20) * i + Math.sin(frameCount * 0.1 + i) * 10;
                const flameHeight = 40 + Math.sin(frameCount * 0.15 + i * 0.5) * 20;
                const flameWidth = 25 + Math.sin(frameCount * 0.1 + i) * 5;
                
                const gradient = ctx.createLinearGradient(x, canvas.height, x, canvas.height - flameHeight);
                gradient.addColorStop(0, 'rgba(255, 100, 0, 0.9)');
                gradient.addColorStop(0.3, 'rgba(255, 200, 0, 0.8)');
                gradient.addColorStop(0.6, 'rgba(255, 100, 0, 0.6)');
                gradient.addColorStop(1, 'rgba(255, 50, 0, 0)');
                
                ctx.beginPath();
                ctx.moveTo(x - flameWidth / 2, canvas.height);
                ctx.quadraticCurveTo(x - flameWidth / 4, canvas.height - flameHeight * 0.7, x, canvas.height - flameHeight);
                ctx.quadraticCurveTo(x + flameWidth / 4, canvas.height - flameHeight * 0.7, x + flameWidth / 2, canvas.height);
                ctx.closePath();
                ctx.fillStyle = gradient;
                ctx.fill();
            }
            
            // Glowing embers at bottom
            for (let i = 0; i < 30; i++) {
                const x = Math.random() * canvas.width;
                const y = canvas.height - 10 - Math.random() * 20;
                const size = 3 + Math.random() * 6;
                const brightness = 0.5 + Math.random() * 0.5;
                
                const gradient = ctx.createRadialGradient(x, y, 0, x, y, size);
                gradient.addColorStop(0, `rgba(255, 200, 50, ${brightness})`);
                gradient.addColorStop(0.5, `rgba(255, 100, 0, ${brightness * 0.7})`);
                gradient.addColorStop(1, `rgba(200, 50, 0, 0)`);
                
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();
            }
            
            // Fire glow effect
            const glowGradient = ctx.createLinearGradient(0, FIRE_Y, 0, canvas.height);
            glowGradient.addColorStop(0, 'rgba(255, 100, 0, 0)');
            glowGradient.addColorStop(0.5, 'rgba(255, 100, 0, 0.3)');
            glowGradient.addColorStop(1, 'rgba(255, 50, 0, 0.5)');
            
            ctx.fillStyle = glowGradient;
            ctx.fillRect(0, FIRE_Y, canvas.width, canvas.height - FIRE_Y);
        }
        
        function gameLoop() {
            frameCount++;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw fire
            updateAndDrawFire();
            
            // Draw pegs
            drawPegs();
            
            if (ball && gameActive) {
                const finished = ball.update();
                ball.draw();
                
                if (!finished) {
                    requestAnimationFrame(gameLoop);
                } else {
                    // Keep animating fire after game ends
                    requestAnimationFrame(function animateFire() {
                        frameCount++;
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        updateAndDrawFire();
                        drawPegs();
                        if (ball) ball.draw();
                        if (gameOver) requestAnimationFrame(animateFire);
                    });
                }
            } else if (!gameActive) {
                // Animate fire when game not active
                requestAnimationFrame(gameLoop);
            }
        }
        
        startButton.addEventListener('click', function() {
            startButton.disabled = true;
            gamesPlayed++;
            gamesPlayedSpan.textContent = gamesPlayed;
            gameOver = false;
            ball = new Ball();
            gameActive = true;
            statusText.textContent = 'Click to drop the ball!';
            statusText.style.color = '#667eea';
        });
        
        canvas.addEventListener('click', function() {
            if (gameActive && ball && !ball.dropped) {
                ball.drop();
                statusText.textContent = '🔥 Falling...';
            }
        });
        
        // Start animation
        gameLoop();
    </script>
</body>
</html>
