<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ball Drop Game - 3D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        #gameCanvas {
            border: 3px solid #667eea;
            border-radius: 10px;
            display: block;
            margin: 20px auto;
            background: radial-gradient(circle at 30% 30%, #e0e7ff, #b8c5f0);
            cursor: pointer;
            box-shadow: inset 0 5px 15px rgba(0,0,0,0.1);
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s;
        }
        button:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        button:disabled { 
            background: #ccc; 
            cursor: not-allowed;
            transform: none;
        }
        .info {
            text-align: center;
            margin: 15px 0;
            padding: 15px;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 10px;
        }
        .status {
            font-weight: bold;
            font-size: 20px;
            color: #667eea;
        }
        .difficulty {
            color: #dc3545;
            font-size: 14px;
            font-weight: bold;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 3D Ball Drop Game</h1>
        <canvas id="gameCanvas" width="500" height="600"></canvas>
        <div class="controls">
            <button id="startButton">Start Game</button>
        </div>
        <div class="info">
            <p class="status" id="status">Click Start Game!</p>
            <p class="difficulty">⚡ HARD MODE: Fast Ball + Small Hole</p>
            <p>Games: <span id="gamesPlayed">0</span></p>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startButton = document.getElementById('startButton');
        const statusText = document.getElementById('status');
        const gamesPlayedSpan = document.getElementById('gamesPlayed');
        
        let ball = null;
        let gameActive = false;
        let gamesPlayed = 0;
        
        const BALL_RADIUS = 15;
        const BALL_SPEED = 8;
        const GRAVITY = 0.8;
        const HOLE_WIDTH = 50;
        const HOLE_Y = canvas.height - 40;

        // Peg configuration
        const PEG_RADIUS = 8;
        const PEG_ROWS = 8;
        const PEG_COLS = 9;
        const pegs = [];

        // Create pegs in a staggered pattern
        function createPegs() {
            const startY = 120;
            const spacingY = 50;
            const spacingX = 55;
            
            for (let row = 0; row < PEG_ROWS; row++) {
                const cols = row % 2 === 0 ? PEG_COLS : PEG_COLS - 1;
                const offsetX = row % 2 === 0 ? 0 : spacingX / 2;
                
                for (let col = 0; col < cols; col++) {
                    const x = 25 + offsetX + col * spacingX;
                    const y = startY + row * spacingY;
                    pegs.push({ x, y, radius: PEG_RADIUS });
                }
            }
        }
        createPegs();
        
        class Ball {
            constructor() {
                this.x = canvas.width / 2;
                this.y = 60;
                this.vx = BALL_SPEED;
                this.vy = 0;
                this.radius = BALL_RADIUS;
                this.dropped = false;
            }
            
            update() {
                if (!this.dropped) {
                    this.x += this.vx;
                    if (this.x - this.radius < 0 || this.x + this.radius > canvas.width) {
                        this.vx *= -1;
                    }
                } else {
                    this.vy += GRAVITY;
                    this.x += this.vx;
                    this.y += this.vy;
                    
                    // Bounce off pegs
                    for (let peg of pegs) {
                        const dx = this.x - peg.x;
                        const dy = this.y - peg.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        
                        if (distance < this.radius + peg.radius) {
                            const angle = Math.atan2(dy, dx);
                            this.vx = Math.cos(angle) * 4;
                            this.vy = Math.sin(angle) * 4;
                            this.x = peg.x + Math.cos(angle) * (this.radius + peg.radius + 1);
                            this.y = peg.y + Math.sin(angle) * (this.radius + peg.radius + 1);
                        }
                    }
                    
                    // Bounce off walls
                    if (this.x - this.radius < 0) {
                        this.x = this.radius;
                        this.vx *= -0.8;
                    }
                    if (this.x + this.radius > canvas.width) {
                        this.x = canvas.width - this.radius;
                        this.vx *= -0.8;
                    }
                    
                    if (this.y + this.radius >= HOLE_Y) {
                        this.checkWin();
                        return true;
                    }
                }
                return false;
            }
            
            draw() {
                const shadowOffset = 5;
                
                ctx.beginPath();
                ctx.arc(this.x + shadowOffset, this.y + shadowOffset, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.fill();
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                
                const gradient = ctx.createRadialGradient(
                    this.x - this.radius/3, 
                    this.y - this.radius/3, 
                    0,
                    this.x, 
                    this.y, 
                    this.radius
                );
                gradient.addColorStop(0, '#ff6b6b');
                gradient.addColorStop(0.3, '#ee5a52');
                gradient.addColorStop(0.7, '#dc3545');
                gradient.addColorStop(1, '#991b1b');
                
                ctx.fillStyle = gradient;
                ctx.fill();
                
                ctx.beginPath();
                ctx.arc(this.x - this.radius/4, this.y - this.radius/4, this.radius/3, 0, Math.PI * 2);
                const highlight = ctx.createRadialGradient(
                    this.x - this.radius/4, 
                    this.y - this.radius/4, 
                    0,
                    this.x - this.radius/4, 
                    this.y - this.radius/4, 
                    this.radius/3
                );
                highlight.addColorStop(0, 'rgba(255, 255, 255, 0.8)');
                highlight.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.fillStyle = highlight;
                ctx.fill();
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.strokeStyle = '#991b1b';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            
            drop() {
                this.dropped = true;
            }
            
            checkWin() {
                const holeCenter = canvas.width / 2;
                const distance = Math.abs(this.x - holeCenter);
                if (distance < HOLE_WIDTH / 2) {
                    statusText.textContent = '🎉 AMAZING! YOU WIN! 🎉';
                    statusText.style.color = '#10b981';
                } else {
                    statusText.textContent = '❌ So close! Try again!';
                    statusText.style.color = '#dc3545';
                }
                gameActive = false;
                startButton.disabled = false;
            }
        }
        
        function drawPegs() {
            for (let peg of pegs) {
                ctx.beginPath();
                ctx.arc(peg.x + 3, peg.y + 3, peg.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.fill();
                
                const gradient = ctx.createRadialGradient(
                    peg.x - peg.radius/3, peg.y - peg.radius/3, 0,
                    peg.x, peg.y, peg.radius
                );
                gradient.addColorStop(0, '#a0a0a0');
                gradient.addColorStop(0.5, '#707070');
                gradient.addColorStop(1, '#404040');
                
                ctx.beginPath();
                ctx.arc(peg.x, peg.y, peg.radius, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();
                
                ctx.beginPath();
                ctx.arc(peg.x - peg.radius/3, peg.y - peg.radius/3, peg.radius/3, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.fill();
            }
        }
        
        function draw3DHole() {
            const center = canvas.width / 2;
            
            ctx.fillStyle = '#000';
            ctx.fillRect(center - HOLE_WIDTH/2 - 5, HOLE_Y - 5, HOLE_WIDTH + 10, 40);
            
            const holeGradient = ctx.createLinearGradient(
                center - HOLE_WIDTH/2, 
                HOLE_Y, 
                center + HOLE_WIDTH/2, 
                HOLE_Y
            );
            holeGradient.addColorStop(0, '#1a5f3f');
            holeGradient.addColorStop(0.5, '#10b981');
            holeGradient.addColorStop(1, '#1a5f3f');
            
            ctx.fillStyle = holeGradient;
            ctx.fillRect(center - HOLE_WIDTH / 2, HOLE_Y, HOLE_WIDTH, 30);
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.fillRect(center - HOLE_WIDTH / 2, HOLE_Y, HOLE_WIDTH, 5);
            
            ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
            ctx.shadowBlur = 3;
            ctx.shadowOffsetX = 2;
            ctx.shadowOffsetY = 2;
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('WIN!', center, HOLE_Y + 20);
            ctx.shadowBlur = 0;
            
            const loseGradient = ctx.createLinearGradient(0, HOLE_Y, canvas.width, HOLE_Y);
            loseGradient.addColorStop(0, '#b91c1c');
            loseGradient.addColorStop(0.5, '#ef4444');
            loseGradient.addColorStop(1, '#b91c1c');
            
            ctx.fillStyle = loseGradient;
            ctx.fillRect(0, HOLE_Y, center - HOLE_WIDTH / 2, 30);
            ctx.fillRect(center + HOLE_WIDTH / 2, HOLE_Y, canvas.width - (center + HOLE_WIDTH / 2), 30);
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.fillRect(0, HOLE_Y, center - HOLE_WIDTH / 2, 5);
            ctx.fillRect(center + HOLE_WIDTH / 2, HOLE_Y, canvas.width - (center + HOLE_WIDTH / 2), 5);
        }
        
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            draw3DHole();
            drawPegs();
            
            if (ball && gameActive) {
                const gameOver = ball.update();
                ball.draw();
                
                if (!gameOver) {
                    requestAnimationFrame(gameLoop);
                }
            }
        }
        
        startButton.addEventListener('click', function() {
            startButton.disabled = true;
            gamesPlayed++;
            gamesPlayedSpan.textContent = gamesPlayed;
            ball = new Ball();
            gameActive = true;
            statusText.textContent = 'Click canvas to drop!';
            statusText.style.color = '#667eea';
            gameLoop();
        });
        
        canvas.addEventListener('click', function() {
            if (gameActive && ball && !ball.dropped) {
                ball.drop();
                statusText.textContent = '⚡ Dropping fast...';
            }
        });
        
        draw3DHole();
        drawPegs();
    </script>
</body>
</html>
