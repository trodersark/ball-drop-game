<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ball Drop – Flaming Wings</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#1a1a2e,#16213e);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}
.container{
    background:#fff;
    padding:20px;
    border-radius:20px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
    width:600px;
}
h1{text-align:center;margin-bottom:10px}
canvas{
    display:block;
    margin:auto;
    border:4px solid #667eea;
    border-radius:12px;
}
button{
    display:block;
    margin:15px auto 0;
    padding:12px 26px;
    font-size:18px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}
button:disabled{opacity:.6}
.status{text-align:center;font-size:18px;margin-top:10px;font-weight:bold}
</style>
</head>
<body>

<div class="container">
<h1>🍗 Ball Drop 🌋</h1>
<canvas id="gameCanvas" width="500" height="700"></canvas>
<button id="startBtn">Start Game</button>
<div class="status" id="status">Click Start</div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const startBtn = document.getElementById("startBtn");
const statusText = document.getElementById("status");

const VOLCANO_X = canvas.width / 2;
const VOLCANO_Y = canvas.height - 180;

let ball = null;
let inferno = false;
let screenShake = 0;
let gameActive = false;

/* ================= WINGS ================= */
const pegs = [];
for(let r=0;r<7;r++){
    for(let c=0;c<8;c++){
        pegs.push({
            x:60+c*50+(r%2?25:0),
            y:120+r*55,
            r:12,
            rotation:(Math.random()-.5)*.6,
            burning:false,
            vy:0,
            char:0
        });
    }
}

/* ================= BALL ================= */
class Ball{
    constructor(){
        this.x = canvas.width/2;
        this.y = 60;
        this.vx = 3.5;
        this.vy = 0;
        this.r = 12;
        this.dropped = false;
        this.fallingIntoHole = false;
    }

    drop(){
        this.dropped = true;
    }

    update(){
        // Idle bounce before drop
        if(!this.dropped){
            this.x += this.vx;
            if(this.x < this.r || this.x > canvas.width - this.r){
                this.vx *= -1;
            }
            return;
        }

        // Commit to volcano
        if(
            !this.fallingIntoHole &&
            this.y > VOLCANO_Y - 130 &&
            Math.abs(this.x - VOLCANO_X) < 35
        ){
            this.fallingIntoHole = true;
            this.vx = 0;
            this.vy = 2;
        }

        // Gravity
        this.vy += 0.4;
        this.y += this.vy;

        // Trigger flames
        if(this.fallingIntoHole && this.y > VOLCANO_Y && !inferno){
            triggerInferno();
        }
    }

    draw(){
        ctx.beginPath();
        ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
        ctx.fillStyle="#e63946";
        ctx.fill();
        ctx.strokeStyle="#000";
        ctx.stroke();
    }
}

/* ================= INFERNO ================= */
function triggerInferno(){
    inferno = true;
    screenShake = 20;
    statusText.textContent = "🔥 WINGS ON FIRE 🔥";

    pegs.forEach(p=>{
        p.burning = true;
        p.vy = Math.random()*3 + 2;
    });
}

/* ================= DRAW WING ================= */
function drawWing(p){
    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.rotate(p.rotation);

    const w = p.r*1.6;
    const h = p.r*2.4;
    const burn = Math.min(p.char,1);

    const g = ctx.createRadialGradient(0,-h*.2,0,0,0,h);
    g.addColorStop(0,`rgb(${255-140*burn},${200-140*burn},${90-80*burn})`);
    g.addColorStop(1,`rgb(${100+80*burn},${50+40*burn},${20+20*burn})`);

    ctx.beginPath();
    ctx.ellipse(0,0,w/2,h/2,0,0,Math.PI*2);
    ctx.fillStyle = g;
    ctx.fill();

    if(p.burning){
        ctx.beginPath();
        ctx.ellipse(0,-h*.6,w*.3,h*.45,0,0,Math.PI*2);
        ctx.fillStyle="rgba(255,120,0,.65)";
        ctx.fill();
    }

    ctx.lineWidth = 3;
    ctx.strokeStyle = "#6b2f10";
    ctx.stroke();
    ctx.restore();
}

/* ================= VOLCANO ================= */
function drawVolcano(){
    ctx.beginPath();
    ctx.moveTo(VOLCANO_X-220,canvas.height);
    ctx.quadraticCurveTo(VOLCANO_X-100,VOLCANO_Y+60,VOLCANO_X-40,VOLCANO_Y-40);
    ctx.lineTo(VOLCANO_X+40,VOLCANO_Y-40);
    ctx.quadraticCurveTo(VOLCANO_X+100,VOLCANO_Y+60,VOLCANO_X+220,canvas.height);
    ctx.closePath();
    ctx.fillStyle="#5b3a2e";
    ctx.fill();
    ctx.lineWidth=5;
    ctx.strokeStyle="#2a1a14";
    ctx.stroke();
}

/* ================= LOOP ================= */
function loop(){
    ctx.save();

    if(screenShake>0){
        ctx.translate(
            (Math.random()-.5)*screenShake,
            (Math.random()-.5)*screenShake
        );
        screenShake *= 0.9;
    }

    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="#87ceeb";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    drawVolcano();

    pegs.forEach(p=>{
        if(p.burning){
            p.char += 0.02;
            p.y += p.vy;
        }
        drawWing(p);
    });

    if(ball){
        if(gameActive) ball.update();
        ball.draw();
    }

    ctx.restore();
    requestAnimationFrame(loop);
}

/* ================= EVENTS ================= */
startBtn.onclick = ()=>{
    inferno = false;
    pegs.forEach(p=>{
        p.burning = false;
        p.char = 0;
    });
    ball = new Ball();
    gameActive = true;
    statusText.textContent = "Click canvas to drop";
};

canvas.onclick = ()=>{
    if(ball && !ball.dropped){
        ball.drop();
    }
};

loop();
</script>
</body>
</html>
