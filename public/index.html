<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egg Drop Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        #gameCanvas {
            border: 3px solid #667eea;
            border-radius: 10px;
            display: block;
            margin: 20px auto;
            background: radial-gradient(circle at 30% 30%, #87CEEB, #5da4d9);
            cursor: pointer;
            box-shadow: inset 0 5px 15px rgba(0,0,0,0.1);
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s;
        }
        button:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        button:disabled { 
            background: #ccc; 
            cursor: not-allowed;
            transform: none;
        }
        .info {
            text-align: center;
            margin: 15px 0;
            padding: 15px;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 10px;
        }
        .status {
            font-weight: bold;
            font-size: 20px;
            color: #667eea;
        }
        .difficulty {
            color: #dc3545;
            font-size: 14px;
            font-weight: bold;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍗 Egg Drop Game 🥚</h1>
        <canvas id="gameCanvas" width="500" height="650"></canvas>
        <div class="controls">
            <button id="startButton">Start Game</button>
        </div>
        <div class="info">
            <p class="status" id="status">Click Start Game!</p>
            <p class="difficulty">🍗 Dodge the wings! Land in the nest! 🪹</p>
            <p>Games: <span id="gamesPlayed">0</span></p>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startButton = document.getElementById('startButton');
        const statusText = document.getElementById('status');
        const gamesPlayedSpan = document.getElementById('gamesPlayed');
        
        let ball = null;
        let gameActive = false;
        let gamesPlayed = 0;
        let gameOver = false;
        
        const BALL_RADIUS = 10;
        const BALL_SPEED = 6;
        const GRAVITY = 0.3;
        const NEST_WIDTH = 70;
        const BRANCH_Y = canvas.height - 100;
        const NEST_Y = BRANCH_Y - 25;

        const PEG_RADIUS = 10;
        const PEG_ROWS = 8;
        const PEG_COLS = 10;
        const pegs = [];

        function createPegs() {
            const startY = 100;
            const spacingY = 45;
            const spacingX = 50;
            
            for (let row = 0; row < PEG_ROWS; row++) {
                const cols = row % 2 === 0 ? PEG_COLS : PEG_COLS - 1;
                const offsetX = row % 2 === 0 ? 25 : 50;
                
                for (let col = 0; col < cols; col++) {
                    const x = offsetX + col * spacingX;
                    const y = startY + row * spacingY;
                    const rotation = Math.random() * Math.PI * 2;
                    pegs.push({ x, y, radius: PEG_RADIUS, rotation, lastHit: 0 });
                }
            }
        }
        createPegs();
        
        let frameCount = 0;
        let fireFlicker = 0;
        
        class Ball {
            constructor() {
                this.x = canvas.width / 2;
                this.y = 50;
                this.vx = BALL_SPEED;
                this.vy = 0;
                this.radius = BALL_RADIUS;
                this.dropped = false;
                this.rotation = 0;
            }
            
            update() {
                if (!this.dropped) {
                    this.x += this.vx;
                    if (this.x - this.radius < 0 || this.x + this.radius > canvas.width) {
                        this.vx *= -1;
                    }
                } else {
                    this.vy += GRAVITY;
                    this.x += this.vx;
                    this.y += this.vy;
                    this.rotation += this.vx * 0.05;
                    
                    if (this.vy > 10) this.vy = 10;
                    
                    for (let peg of pegs) {
                        const dx = this.x - peg.x;
                        const dy = this.y - peg.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        
                        if (distance < this.radius + peg.radius && frameCount - peg.lastHit > 10) {
                            peg.lastHit = frameCount;
                            
                            const angle = Math.atan2(dy, dx);
                            
                            this.x = peg.x + Math.cos(angle) * (this.radius + peg.radius + 3);
                            this.y = peg.y + Math.sin(angle) * (this.radius + peg.radius + 3);
                            
                            this.vx = (Math.random() - 0.5) * 6;
                            this.vy = 2 + Math.random() * 2;
                        }
                    }
                    
                    if (this.x - this.radius < 0) {
                        this.x = this.radius;
                        this.vx = Math.abs(this.vx) * 0.8;
                    }
                    if (this.x + this.radius > canvas.width) {
                        this.x = canvas.width - this.radius;
                        this.vx = -Math.abs(this.vx) * 0.8;
                    }
                    
                    if (this.y + this.radius >= NEST_Y + 15) {
                        this.checkWin();
                        return true;
                    }
                }
                return false;
            }
            
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                
                ctx.beginPath();
                ctx.ellipse(3, 3, this.radius * 0.7, this.radius, 0, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.fill();
                
                ctx.beginPath();
                ctx.ellipse(0, 0, this.radius * 0.7, this.radius, 0, 0, Math.PI * 2);
                
                const gradient = ctx.createRadialGradient(-3, -3, 0, 0, 0, this.radius);
                gradient.addColorStop(0, '#fffef5');
                gradient.addColorStop(0.5, '#f5e6c8');
                gradient.addColorStop(1, '#e8d4a8');
                
                ctx.fillStyle = gradient;
                ctx.fill();
                
                ctx.beginPath();
                ctx.ellipse(-3, -5, 4, 5, -0.3, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.fill();
                
                ctx.beginPath();
                ctx.ellipse(0, 0, this.radius * 0.7, this.radius, 0, 0, Math.PI * 2);
                ctx.strokeStyle = '#d4c4a4';
                ctx.lineWidth = 1;
                ctx.stroke();
                
                ctx.restore();
            }
            
            drop() {
                this.dropped = true;
            }
            
            checkWin() {
                const nestCenter = canvas.width / 2;
                const distance = Math.abs(this.x - nestCenter);
                if (distance < NEST_WIDTH / 2) {
                    statusText.textContent = '🎉 EGG-CELLENT! YOU WIN! 🥚';
                    statusText.style.color = '#10b981';
                } else {
                    statusText.textContent = '🍳 Scrambled! Try again!';
                    statusText.style.color = '#dc3545';
                }
                gameActive = false;
                gameOver = true;
                startButton.disabled = false;
            }
        }
        
        function drawChickenWing(x, y, radius, rotation) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rotation);
            
            ctx.beginPath();
            ctx.ellipse(2, 2, radius * 1.2, radius * 0.6, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fill();
            
            ctx.beginPath();
            ctx.ellipse(0, 0, radius * 1.2, radius * 0.6, 0, 0, Math.PI * 2);
            
            const gradient = ctx.createRadialGradient(-2, -1, 0, 0, 0, radius * 1.2);
            gradient.addColorStop(0, '#e8a849');
            gradient.addColorStop(0.5, '#c46d1d');
            gradient.addColorStop(1, '#8b4513');
            
            ctx.fillStyle = gradient;
            ctx.fill();
            
            ctx.beginPath();
            ctx.ellipse(-radius * 0.4, -radius * 0.1, radius * 0.3, radius * 0.15, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 200, 100, 0.5)';
            ctx.fill();
            
            ctx.beginPath();
            ctx.ellipse(radius * 1.0, 0, radius * 0.2, radius * 0.12, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#f5f5dc';
            ctx.fill();
            ctx.strokeStyle = '#d4c8a0';
            ctx.lineWidth = 1;
            ctx.stroke();
            
            ctx.restore();
        }
        
        function drawPegs() {
            for (let peg of pegs) {
                drawChickenWing(peg.x, peg.y, peg.radius, peg.rotation);
            }
        }
        
        function drawFire() {
            const fireX = canvas.width / 2;
            const fireY = canvas.height - 25;
            
            fireFlicker = (fireFlicker + 0.15) % (Math.PI * 2);
            
            // Draw multiple flames
            for (let i = 0; i < 7; i++) {
                const offsetX = (i - 3) * 30;
                const flameHeight = 35 + Math.sin(fireFlicker + i) * 8;
                const flameWidth = 15 + Math.sin(fireFlicker + i * 0.5) * 3;
                
                // Outer flame (red/orange)
                ctx.beginPath();
                ctx.moveTo(fireX + offsetX - flameWidth, fireY);
                ctx.quadraticCurveTo(fireX + offsetX - flameWidth/2, fireY - flameHeight * 0.6, fireX + offsetX, fireY - flameHeight);
                ctx.quadraticCurveTo(fireX + offsetX + flameWidth/2, fireY - flameHeight * 0.6, fireX + offsetX + flameWidth, fireY);
                ctx.closePath();
                
                const outerGradient = ctx.createLinearGradient(fireX + offsetX, fireY, fireX + offsetX, fireY - flameHeight);
                outerGradient.addColorStop(0, '#ff4500');
                outerGradient.addColorStop(0.3, '#ff6a00');
                outerGradient.addColorStop(0.6, '#ff8c00');
                outerGradient.addColorStop(1, '#ffcc00');
                
                ctx.fillStyle = outerGradient;
                ctx.fill();
                
                // Inner flame (yellow/white)
                const innerHeight = flameHeight * 0.6;
                const innerWidth = flameWidth * 0.5;
                
                ctx.beginPath();
                ctx.moveTo(fireX + offsetX - innerWidth, fireY);
                ctx.quadraticCurveTo(fireX + offsetX - innerWidth/2, fireY - innerHeight * 0.6, fireX + offsetX, fireY - innerHeight);
                ctx.quadraticCurveTo(fireX + offsetX + innerWidth/2, fireY - innerHeight * 0.6, fireX + offsetX + innerWidth, fireY);
                ctx.closePath();
                
                const innerGradient = ctx.createLinearGradient(fireX + offsetX, fireY, fireX + offsetX, fireY - innerHeight);
                innerGradient.addColorStop(0, '#ffcc00');
                innerGradient.addColorStop(0.5, '#ffff66');
                innerGradient.addColorStop(1, '#ffffcc');
                
                ctx.fillStyle = innerGradient;
                ctx.fill();
            }
            
            // Glowing coals at base
            for (let i = 0; i < 12; i++) {
                const coalX = fireX - 100 + i * 18 + Math.sin(fireFlicker + i) * 2;
                const coalY = fireY + 5;
                const coalRadius = 8 + Math.random() * 4;
                
                const coalGradient = ctx.createRadialGradient(coalX, coalY, 0, coalX, coalY, coalRadius);
                coalGradient.addColorStop(0, '#ff6600');
                coalGradient.addColorStop(0.5, '#cc3300');
                coalGradient.addColorStop(1, '#330000');
                
                ctx.beginPath();
                ctx.arc(coalX, coalY, coalRadius, 0, Math.PI * 2);
                ctx.fillStyle = coalGradient;
                ctx.fill();
            }
        }
        
        function drawFryingPan() {
            const panY = canvas.height - 60;
            const panWidth = canvas.width - 80;
            const panHeight = 25;
            const panX = 40;
            
            // Pan shadow
            ctx.beginPath();
            ctx.ellipse(canvas.width / 2, panY + panHeight + 5, panWidth / 2, 10, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fill();
            
            // Pan handle (left side)
            ctx.fillStyle = '#2a2a2a';
            ctx.fillRect(-10, panY + 5, 60, 12);
            
            // Handle grip
            const handleGradient = ctx.createLinearGradient(-10, panY + 5, -10, panY + 17);
            handleGradient.addColorStop(0, '#1a1a1a');
            handleGradient.addColorStop(0.5, '#333');
            handleGradient.addColorStop(1, '#1a1a1a');
            ctx.fillStyle = handleGradient;
            ctx.fillRect(-10, panY + 5, 50, 12);
            
            // Pan body
            ctx.beginPath();
            ctx.ellipse(canvas.width / 2, panY + panHeight / 2, panWidth / 2, panHeight, 0, 0, Math.PI * 2);
            
            const panGradient = ctx.createRadialGradient(canvas.width / 2, panY, 0, canvas.width / 2, panY + panHeight / 2, panWidth / 2);
            panGradient.addColorStop(0, '#4a4a4a');
            panGradient.addColorStop(0.3, '#3a3a3a');
            panGradient.addColorStop(0.7, '#2a2a2a');
            panGradient.addColorStop(1, '#1a1a1a');
            
            ctx.fillStyle = panGradient;
            ctx.fill();
            
            // Pan inner surface (darker)
            ctx.beginPath();
            ctx.ellipse(canvas.width / 2, panY + panHeight / 2, panWidth / 2 - 8, panHeight - 5, 0, 0, Math.PI * 2);
            
            const innerGradient = ctx.createRadialGradient(canvas.width / 2, panY, 0, canvas.width / 2, panY + panHeight / 2, panWidth / 2 - 8);
            innerGradient.addColorStop(0, '#2d2d2d');
            innerGradient.addColorStop(1, '#1a1a1a');
            
            ctx.fillStyle = innerGradient;
            ctx.fill();
            
            // Oil sheen / reflection
            ctx.beginPath();
            ctx.ellipse(canvas.width / 2 - 50, panY + 5, 60, 8, -0.2, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.fill();
            
            // Pan rim highlight
            ctx.beginPath();
            ctx.ellipse(canvas.width / 2, panY + panHeight / 2, panWidth / 2, panHeight, 0, Math.PI, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.lineWidth = 2;
            ctx.stroke();
        }
        
        function drawTreeBranch() {
            const branchY = BRANCH_Y;
            
            // Main branch
            ctx.beginPath();
            ctx.moveTo(-20, branchY + 15);
            ctx.quadraticCurveTo(100, branchY - 5, canvas.width / 2, branchY);
            ctx.quadraticCurveTo(canvas.width - 100, branchY + 10, canvas.width + 20, branchY - 5);
            ctx.lineTo(canvas.width + 20, branchY + 25);
            ctx.quadraticCurveTo(canvas.width - 100, branchY + 30, canvas.width / 2, branchY + 20);
            ctx.quadraticCurveTo(100, branchY + 25, -20, branchY + 35);
            ctx.closePath();
            
            const branchGradient = ctx.createLinearGradient(0, branchY - 5, 0, branchY + 35);
            branchGradient.addColorStop(0, '#8B5A2B');
            branchGradient.addColorStop(0.3, '#6B4423');
            branchGradient.addColorStop(0.7, '#5D3A1A');
            branchGradient.addColorStop(1, '#4A2F15');
            
            ctx.fillStyle = branchGradient;
            ctx.fill();
            
            // Bark texture
            ctx.strokeStyle = '#3d2510';
            ctx.lineWidth = 1;
            for (let i = 0; i < 15; i++) {
                const x = 30 + i * 32;
                ctx.beginPath();
                ctx.moveTo(x, branchY + 5);
                ctx.lineTo(x + 5, branchY + 18);
                ctx.stroke();
            }
            
            // Branch highlight
            ctx.beginPath();
            ctx.moveTo(0, branchY + 8);
            ctx.quadraticCurveTo(canvas.width / 2, branchY, canvas.width, branchY + 5);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 3;
            ctx.stroke();
        }
        
        function drawNest() {
            const nestX = canvas.width / 2;
            const nestY = NEST_Y;
            const nestWidth = NEST_WIDTH;
            const nestHeight = 35;
            
            // Nest shadow on branch
            ctx.beginPath();
            ctx.ellipse(nestX, nestY + nestHeight + 5, nestWidth / 2 + 5, 8, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fill();
            
            // Nest base (outer twigs)
            ctx.beginPath();
            ctx.ellipse(nestX, nestY + nestHeight / 2, nestWidth / 2 + 10, nestHeight / 2 + 5, 0, 0, Math.PI * 2);
            
            const outerNestGradient = ctx.createRadialGradient(nestX, nestY, 0, nestX, nestY + nestHeight / 2, nestWidth / 2 + 10);
            outerNestGradient.addColorStop(0, '#8B7355');
            outerNestGradient.addColorStop(0.5, '#6B5344');
            outerNestGradient.addColorStop(1, '#4A3728');
            
            ctx.fillStyle = outerNestGradient;
            ctx.fill();
            
            // Draw individual twigs around nest
            ctx.strokeStyle = '#5D4037';
            ctx.lineWidth = 2;
            for (let i = 0; i < 30; i++) {
                const angle = (i / 30) * Math.PI * 2;
                const innerR = nestWidth / 2 - 5;
                const outerR = nestWidth / 2 + 15;
                const startX = nestX + Math.cos(angle) * innerR;
                const startY = nestY + nestHeight / 2 + Math.sin(angle) * (nestHeight / 2 - 3);
                const endX = nestX + Math.cos(angle + 0.2) * outerR;
                const endY = nestY + nestHeight / 2 + Math.sin(angle + 0.2) * (nestHeight / 2 + 8);
                
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.quadraticCurveTo(startX + (Math.random() - 0.5) * 10, startY + (Math.random() - 0.5) * 10, endX, endY);
                ctx.stroke();
            }
            
            // Nest inner bowl
            ctx.beginPath();
            ctx.ellipse(nestX, nestY + nestHeight / 2 + 5, nestWidth / 2 - 5, nestHeight / 2 - 8, 0, 0, Math.PI * 2);
            
            const innerNestGradient = ctx.createRadialGradient(nestX, nestY + 5, 0, nestX, nestY + nestHeight / 2 + 5, nestWidth / 2 - 5);
            innerNestGradient.addColorStop(0, '#3E2723');
            innerNestGradient.addColorStop(1, '#2A1B18');
            
            ctx.fillStyle = innerNestGradient;
            ctx.fill();
            
            // Soft lining in nest
            ctx.beginPath();
            ctx.ellipse(nestX, nestY + nestHeight / 2 + 8, nestWidth / 2 - 12, nestHeight / 2 - 12, 0, 0, Math.PI * 2);
            
            const liningGradient = ctx.createRadialGradient(nestX, nestY + 10, 0, nestX, nestY + nestHeight / 2 + 8, nestWidth / 2 - 12);
            liningGradient.addColorStop(0, '#D7CCC8');
            liningGradient.addColorStop(0.5, '#BCAAA4');
            liningGradient.addColorStop(1, '#8D6E63');
            
            ctx.fillStyle = liningGradient;
            ctx.fill();
            
            // Feather details in lining
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            for (let i = 0; i < 5; i++) {
                const featherX = nestX - 20 + i * 10;
                const featherY = nestY + nestHeight / 2 + 5;
                ctx.beginPath();
                ctx.ellipse(featherX, featherY, 6, 3, Math.random(), 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function drawScene() {
            // Draw fire at bottom
            drawFire();
            
            // Draw frying pan above fire
            drawFryingPan();
            
            // Draw tree branch
            drawTreeBranch();
            
            // Draw nest on branch
            drawNest();
        }
        
        function gameLoop() {
            frameCount++;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw the scene
            drawScene();
            
            // Draw pegs
            drawPegs();
            
            if (ball && gameActive) {
                const finished = ball.update();
                ball.draw();
                
                if (!finished) {
                    requestAnimationFrame(gameLoop);
                }
            }
        }
        
        startButton.addEventListener('click', function() {
            startButton.disabled = true;
            gamesPlayed++;
            gamesPlayedSpan.textContent = gamesPlayed;
            gameOver = false;
            ball = new Ball();
            gameActive = true;
            statusText.textContent = 'Click to drop the egg!';
            statusText.style.color = '#667eea';
            gameLoop();
        });
        
        canvas.addEventListener('click', function() {
            if (gameActive && ball && !ball.dropped) {
                ball.drop();
                statusText.textContent = '🥚 Egg falling...';
            }
        });
        
        // Initial draw
        drawScene();
        drawPegs();
    </script>
</body>
</html>
